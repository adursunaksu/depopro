<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Depo Pro v50</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <style>
        :root { --excell-green: #217346; --excell-hover: #1a5c38; --border: #d4d4d4; --bg: #f3f3f3; }
        .bg-in { background-color: #d9e9f3 !important; color: #0078d4 !important; font-weight: bold; }
        .bg-out { background-color: #f8dbdb !important; color: #d83b01 !important; font-weight: bold; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; font-size: 11px; }
        body { margin: 0; background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #sube-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; padding:20px; }
        .modal-box { background:white; border-radius:8px; height:85vh; display:flex; flex-direction:column; overflow:hidden; }
        .modal-search { padding:10px; border-bottom:1px solid #eee; background: #f9f9f9; }
        .modal-search input { width:100%; padding:15px; border:2px solid var(--excell-green); border-radius:4px; font-size:14px; }
        .modal-list { flex:1; overflow-y:auto; }
        .sube-item { padding:15px; border-bottom:1px solid #f0f0f0; font-size:13px; font-weight: 500; }
        .excel-bar { background: var(--excell-green); color: white; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .user-cell { background: #fff; color: #333; padding: 3px 10px; border: 1px solid #999; font-weight: bold; }
        .content { flex: 1; overflow-y: auto; padding: 5px; padding-bottom: 70px; }
        .excel-row-container { display: flex; border: 1px solid #ccc; background: #fff; margin-bottom: 3px; height: 44px; align-items: center; border-radius: 4px; overflow: hidden; }
        .type-select { width: 70px; height: 100%; border: none; border-right: 1px solid #ccc; padding-left: 5px; font-weight: bold; }
        .barkod-input { flex: 2; height: 100%; border: none; border-right: 1px solid #ccc; padding: 0 12px; font-size: 13px; background: #fafafa; }
        .urun-select { flex: 1; height: 100%; border: none; padding-left: 5px; background: #fff; font-weight: 500; }
        .excel-actions { display: flex; gap: 8px; padding: 10px; background: #fff; border: 1px solid #ccc; margin-top: 5px; border-radius: 4px; }
        .btn-excel-add { flex: 1; padding: 12px; background: #f8f9fa; border: 1px solid #adb5bd; color: #495057; font-weight: bold; border-radius: 4px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-excel-save { flex: 2; padding: 12px; background: var(--excell-green); border: 1px solid #1a5c38; color: white; font-weight: bold; border-radius: 4px; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .status-waiting { background-color: #ffebee !important; color: #b71c1c !important; }
        .status-done { background-color: #e8f5e9 !important; color: #2e7d32 !important; }    
        table.excel-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        .excel-table th, .excel-table td { border: 1px solid var(--border); padding: 6px 2px; text-align: left; overflow: hidden; }
        .excel-table th { background: #ebf1de; font-size: 10px; }
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; width: 100%; }
        .btn-status { border: none; padding: 8px 2px; border-radius: 4px; font-weight: bold; font-size: 9px; width: 100%; cursor: pointer; }
        .btn-red { background: #d32f2f; color: white; } 
        .btn-green { background: #2e7d32; color: white; } 
        .kp-input-small { width: 100%; padding: 4px 2px; border: 1px solid #aaa; font-size: 11px; text-align: center; }
        .excel-nav { height: 55px; background: #fff; border-top: 1px solid var(--border); display: flex; position: fixed; bottom: 0; width: 100%; }
        .excel-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; cursor: pointer; }
        .excel-nav-item.active { background: #e9e9e9; color: var(--excell-green); font-weight: bold; border-top: 3px solid var(--excell-green); }
        #login-screen { position: fixed; inset: 0; background: var(--excell-green); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>

<div id="login-screen">
    <h2>DEPO PRO v50</h2>
    <input type="email" id="email" placeholder="E-posta" style="width:80%; margin:10px; padding:12px;">
    <input type="password" id="pass" placeholder="Şifre" style="width:80%; margin:10px; padding:12px;">
    <button onclick="login()" style="width:80%; padding:15px; font-weight:bold;">GİRİŞ</button>
</div>

<div id="sube-modal">
    <div class="modal-box">
        <div class="modal-search"><input type="text" id="sube-ara" placeholder="Şube ara..." oninput="filterSubeler()"></div>
        <div class="modal-list" id="modal-list-body"></div>
        <button onclick="closeModal()" style="padding:15px; background:#f44336; color:white; border:none; font-weight:bold;">KAPAT</button>
    </div>
</div>

<div class="excel-bar">
    <div style="font-weight:bold;">TRANSFER TAKİP</div>
    <div class="user-cell" id="userTag">...</div>
</div>

<div class="content">
    <div id="p-islem" class="app-page">
        <div id="form-content">
            <div style="background:#fff; padding:10px; border:1px solid #ccc; margin-bottom:5px; border-radius:4px;">
                <div id="sube-select-container">
                    <input type="text" id="target-sube" placeholder="Hedef Şube Seçin (117)" readonly onclick="openModal()" style="width:100%; margin-bottom:10px; padding:12px; background:#fffde7; border:1px solid #ccc; font-weight:bold; border-radius:4px;">
                </div>
                <label style="display:flex; align-items:center; gap:10px; color:var(--excell-green); font-weight:bold; font-size:12px;">
                    <input type="checkbox" id="to-my-truck" onchange="toggleTruckMode()"> 🚛 ARACIMA TRANSFER ET
                </label>
            </div>
            <div id="items-container"></div>
            <div class="excel-actions">
                <button class="btn-excel-add" onclick="addRowEx()"><span>➕</span> Satır Ekle</button>
                <button class="btn-excel-save" onclick="saveAllEx()"><span>💾</span> KAYDET (SİSTEME İŞLE)</button>
            </div>
        </div>
    </div>
    <div id="p-akis" class="app-page" style="display:none;">
        <table class="excel-table" id="mainExTable">
            <thead>
                <tr>
                    <th style="width:25%;">Şube/Araç</th>
                    <th style="width:25%;">Ürün/Barkod</th>
                    <th style="width:14%;">Asistan</th>
                    <th style="width:14%;">KP</th>
                    <th style="width:22%;">FINART</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <div id="p-depolar" class="app-page" style="display:none;">
        <div id="depoExList"></div>
    </div>
</div>

<div class="excel-nav">
    <div class="excel-nav-item active" id="nav-form" onclick="tabEx('islem', this)">📝 Form</div>
    <div class="excel-nav-item" id="nav-akis" onclick="tabEx('akis', this)">📊 Akış</div>
    <div class="excel-nav-item" id="nav-depo" onclick="tabEx('depolar', this)">📦 Depo</div>
</div>

    function openModal() { if(isAdmin) return; document.getElementById('sube-modal').style.display = 'block'; document.getElementById('sube-ara').value = ""; filterSubeler(); setTimeout(() => document.getElementById('sube-ara').focus(), 150); }
    function closeModal() { document.getElementById('sube-modal').style.display = 'none'; }
    function selectSube(val) { document.getElementById('target-sube').value = val; closeModal(); }
    
    function filterSubeler() {
        const ara = document.getElementById('sube-ara').value.toLocaleUpperCase('tr-TR');
        const list = document.getElementById('modal-list-body'); list.innerHTML = "";
        const res = subeler.filter(s => s.toLocaleUpperCase('tr-TR').includes(ara));
        if(res.length === 1 && ara.length > 0) { selectSube(res[0]); return; }
        res.forEach(s => { const div = document.createElement('div'); div.className = "sube-item"; div.innerText = s; div.onclick = () => selectSube(s); list.appendChild(div); });
    }

    function login() {
        const e = document.getElementById('email').value.trim().toLowerCase();
        const p = document.getElementById('pass').value;
        firebase.auth().signInWithEmailAndPassword(e, p).then(u => {
            isAdmin = (e === "ekaradeniz@ziraatbank.com.tr");
            uKey = isAdmin ? "EDİZ" : (aracListesi[e] || e.split('@')[0].toUpperCase());
            document.getElementById('userTag').innerText = uKey;
            document.getElementById('login-screen').style.display = 'none';
            if(isAdmin) { document.getElementById('nav-form').remove(); document.getElementById('p-islem').remove(); tabEx('akis', document.getElementById('nav-akis')); } 
            else { addRowEx("GİRİŞ"); addRowEx("ÇIKIŞ"); }
            init();
        }).catch(() => alert("Giriş Başarısız!"));
    }

    function toggleTruckMode() {
        if(isAdmin) return;
        const isTruck = document.getElementById('to-my-truck').checked;
        document.getElementById('sube-select-container').style.display = isTruck ? "none" : "block";
        document.querySelectorAll('.type-select').forEach(sel => { sel.style.display = isTruck ? "none" : "block"; if(isTruck) sel.value = "GİRİŞ"; });
        document.getElementById('target-sube').value = isTruck ? uKey : "";
    }

    function addRowEx(defaultType = "GİRİŞ") {
        if(isAdmin) return;
        const isTruck = document.getElementById('to-my-truck').checked;
        const div = document.createElement('div'); div.className = "excel-row-container";
        const isOut = defaultType === "ÇIKIŞ";
        div.innerHTML = `
            <select class="type-select ${isOut ? 'bg-out' : 'bg-in'}" onchange="colorUpdate(this)" style="${isTruck ? 'display:none;' : ''}">
                <option value="GİRİŞ" ${defaultType === "GİRİŞ" ? "selected" : ""}>AL (+)</option>
                <option value="ÇIKIŞ" ${defaultType === "ÇIKIŞ" ? "selected" : ""}>VER (-)</option>
            </select>
            <input type="number" inputmode="numeric" placeholder="Barkod No..." class="barkod-input">
            <select class="urun-select">
                <option value="Cüzdan yazıcı">Cüzdan yazıcı</option><option value="Pc">Pc</option><option value="Tarayıcı">Tarayıcı</option><option value="Monitör">Monitör</option><option value="Ip telefon">Ip telefon</option><option value="Switch">Switch</option><option value="Router">Router</option><option value="Sunucu">Sunucu</option><option value="Nvr">Nvr</option><option value="Laptop">Laptop</option><option value="Lazer yazıcı">Lazer yazıcı</option>
            </select>`;
        document.getElementById('items-container').appendChild(div);
    }

    function saveAllEx() {
        if(isAdmin) return;
        const isTruck = document.getElementById('to-my-truck').checked;
        const target = isTruck ? uKey : document.getElementById('target-sube').value;
        if(!target) return alert("Hedef Şube Seçin!");
        let savedCount = 0;
        document.querySelectorAll('.barkod-input').forEach((input) => {
            if(input.value) {
                const parent = input.parentElement;
                const data = {
                    gonderen: uKey, yer: target,
                    tip: isTruck ? "GİRİŞ" : parent.querySelector('.type-select').value,
                    barkod: input.value, urun: parent.querySelector('.urun-select').value,
                    status: "BEKLEMEDE", kp: "", saat: new Date().toLocaleTimeString('tr-TR')
                };
                db.ref('transferler/canli_akis').push(data);
                if(isTruck) db.ref('depolar/' + uKey).push(data);
                savedCount++;
            }
        });
        if(savedCount === 0) return alert("Barkod girin!");
        document.getElementById('items-container').innerHTML = ""; 
        document.getElementById('to-my-truck').checked = false; toggleTruckMode();
        addRowEx("GİRİŞ"); addRowEx("ÇIKIŞ"); alert(savedCount + " Kayıt Tamamlandı.");
    }

    function saveKP(key, val) { db.ref('transferler/canli_akis/' + key).update({ kp: val }); }
    function toggleStatus(key, current) { db.ref('transferler/canli_akis/' + key).update({ status: (current === "BEKLEMEDE" ? "YAPILDI" : "BEKLEMEDE") }); }

    function tabEx(id, el) {
        document.querySelectorAll('.app-page').forEach(p => p.style.display = 'none');
        if(document.getElementById('p-'+id)) document.getElementById('p-'+id).style.display = 'block';
        document.querySelectorAll('.excel-nav-item').forEach(n => n.classList.remove('active'));
        if(el) el.classList.add('active');
    }

    function init() {
        db.ref('transferler/canli_akis').on('value', snap => {
            const b = document.querySelector('#mainExTable tbody'); b.innerHTML = "";
            snap.forEach(i => {
                const d = i.val(); const isDone = d.status === "YAPILDI";
                b.innerHTML = `<tr class="${isDone ? 'status-done' : 'status-waiting'}">
                    <td><span class="truncate ${isDone ? 'strikethrough' : ''}">${d.yer}</span></td>
                    <td class="${isDone ? 'strikethrough' : ''}"><b>${d.urun}</b><br>${d.barkod}</td>
                    <td class="${isDone ? 'strikethrough' : ''}">${d.gonderen}</td>
                    <td><input type="number" class="kp-input-small" onblur="saveKP('${i.key}', this.value)" value="${d.kp || ''}"></td>
                    <td><button class="btn-status ${isDone ? 'btn-green' : 'btn-red'}" onclick="toggleStatus('${i.key}','${d.status}')">${isDone ? 'TAMAMLANDI' : 'BEKLEYEN'}</button></td>
                </tr>` + b.innerHTML;
            });
        });
        db.ref('depolar').on('value', snap => {
            const c = document.getElementById('depoExList'); c.innerHTML = "";
            snap.forEach(d => {
                let rws = ""; d.forEach(r => { const v = r.val(); rws += `<tr><td>${v.urun}</td><td>${v.barkod}</td></tr>`; });
                c.innerHTML += `<div style="margin-bottom:10px; border:1px solid #ccc; border-radius:4px; overflow:hidden;"><div style="background:#217346; color:white; padding:5px; font-weight:bold;">👤 ${d.key} ENVANTERİ</div><table class="excel-table">${rws}</table></div>`;
            });
        });
    }
    function colorUpdate(el) { el.classList.toggle('bg-out', el.value === "ÇIKIŞ"); el.classList.toggle('bg-in', el.value === "GİRİŞ"); }
</script>
</body>
</html>
