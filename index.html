<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>S016 Depo Takip v75</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <style>
        :root { --excell-green: #217346; --border: #d4d4d4; --bg: #f3f3f3; }
        .bg-in { background-color: #d9e9f3 !important; color: #0078d4 !important; font-weight: bold; }
        .bg-out { background-color: #f8dbdb !important; color: #d83b01 !important; font-weight: bold; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; font-size: 11px; }
        body { margin: 0; background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #transfer-modal, #sube-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; padding:20px; }
        .modal-box { background:white; border-radius:8px; height:85vh; display:flex; flex-direction:column; overflow:hidden; border: 1px solid #666; }
        .modal-search { padding:10px; border-bottom:1px solid #eee; }
        .modal-search input { width:100%; padding:12px; border:2px solid var(--excell-green); border-radius:4px; font-size:14px; outline: none; }
        .modal-list { flex:1; overflow-y:auto; }
        .sube-item { padding:15px; border-bottom:1px solid #f0f0f0; font-size:13px; color: #333; cursor: pointer; }
        .sube-item:active { background: #e8f5e9; }
        
        .add-btn-list { padding: 15px; background: #e8f5e9; color: var(--excell-green); text-align: center; font-weight: bold; cursor: pointer; border-top: 1px solid #ddd; }

        .excel-bar { background: var(--excell-green); color: white; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .user-cell { background: #fff; color: #333; padding: 3px 10px; border: 1px solid #999; font-weight: bold; }
        .content { flex: 1; overflow-y: auto; padding: 5px; padding-bottom: 70px; }
        
        .excel-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        .excel-table th, .excel-table td { border: 1px solid var(--border); padding: 8px 4px; text-align: left; overflow: hidden; }
        .excel-table th { background: #ebf1de; font-size: 10px; font-weight: bold; color: #444; }
        
        .depo-row { cursor: pointer; transition: background 0.2s; }
        .depo-row:active { background: #fff3cd; }
        .row-waiting { background-color: #f8d7da !important; }
        .row-onay { background-color: #fff3cd !important; }
        .row-done { background-color: #d4edda !important; text-decoration: line-through; color: #666; }
        .btn-status { width: 100%; padding: 8px 2px; border: none; border-radius: 3px; font-weight: bold; color: white; font-size: 10px; }
        .bg-waiting { background: #dc3545; }
        .bg-onay { background: #ff9800; }
        .bg-done { background: #28a745; }
        .excel-row-container { display: flex; border: 1px solid #ccc; background: #fff; margin-bottom: 3px; min-height: 44px; align-items: center; border-radius: 4px; overflow: hidden; }
        .type-select { width: 60px; height: 44px; border: none; border-right: 1px solid #ccc; font-weight: bold; text-align: center; outline: none; }
        .barkod-input { flex: 2; height: 44px; border: none; border-right: 1px solid #ccc; padding: 0 10px; font-size: 13px; outline: none; }
        .urun-select { flex: 2; height: 44px; border: none; padding-left: 5px; font-weight: bold; outline: none; background: transparent; }
        .excel-actions { display: flex; gap: 5px; margin-top: 8px; }
        .btn-excel-add { flex: 1; padding: 12px; border: 1px solid #ccc; font-weight: bold; background: white; border-radius: 4px; cursor: pointer; }
        .btn-excel-save { flex: 1; padding: 12px; background: var(--excell-green); color: white; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
        .excel-nav { height: 55px; background: #fff; border-top: 1px solid var(--border); display: flex; position: fixed; bottom: 0; width: 100%; }
        .excel-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; cursor: pointer; }
        .excel-nav-item.active { background: #f0f0f0; color: var(--excell-green); font-weight: bold; border-top: 3px solid var(--excell-green); }
        #login-screen { position: fixed; inset: 0; background: var(--excell-green); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .kp-input-large { width: 100%; border: 1px solid #ddd; padding: 4px; border-radius: 2px; }
    </style>
</head>
<body>

<div id="login-screen">
    <h2 style="letter-spacing: 2px;">S016 DEPO TAKİP</h2>
    <input type="email" id="email" placeholder="E-posta" style="width:80%; margin-bottom:10px; padding:12px; border-radius:4px; border:none;">
    <input type="password" id="pass" placeholder="Şifre" style="width:80%; margin-bottom:20px; padding:12px; border-radius:4px; border:none;">
    <button onclick="login()" style="width:80%; padding:15px; font-weight:bold; background:white; color:var(--excell-green); border:none; border-radius:4px;">GİRİŞ YAP</button>
</div>

<div id="transfer-modal">

        <div class="modal-search">
            <h3 id="transfer-item-title" style="margin:0 0 10px 0; color:var(--excell-green);">Ürün Gönder</h3>

        </div>
        <div class="modal-list" id="transfer-list-body"></div>
        <button onclick="closeTransferModal()" style="padding:15px; background:#444; color:white; border:none; font-weight:bold;">VAZGEÇ</button>
    </div>
</div>

<div id="sube-modal">
    <div class="modal-box">
        <div class="modal-search"><input type="text" id="sube-ara" placeholder="Şube ara (Kod veya İsim)..." oninput="filterSubeler()"></div>
        <div class="modal-list" id="modal-list-body"></div>
        <div class="add-btn-list" onclick="manualAdd()">➕ LİSTEDE OLMAYAN ŞUBEYİ EKLE</div>
        <button onclick="closeModal()" style="padding:15px; background:#444; color:white; border:none; font-weight:bold;">VAZGEÇ</button>
    </div>
</div>

<div class="excel-bar">
    <div style="font-weight:bold;">S016_DEPO_TAKIP_v75.xlsx</div>
    <div class="user-cell" id="userTag">...</div>
</div>

<div class="content">
    <div id="p-islem" class="app-page">
        <div style="background:#fff; padding:10px; border:1px solid #ccc; margin-bottom:5px; border-radius:4px;">
            <input type="text" id="target-sube" placeholder="Hedef Şube Seçin" readonly onclick="openModal()" style="width:100%; margin-bottom:10px; padding:12px; background:#fffde7; border:1px solid #ccc; font-weight:bold; border-radius:4px; color: #000;">
            <label style="display:flex; align-items:center; gap:10px; color:var(--excell-green); font-weight:bold;">
                <input type="checkbox" id="to-my-truck" onchange="toggleTruckMode()"> 🚛 ARACIMA TRANSFER ET
            </label>
        </div>
        <div id="items-container"></div>
        <div id="action-area" class="excel-actions">
            <button class="btn-excel-add" onclick="addRowEx()">➕ Satır Ekle</button>
            <button class="btn-excel-save" id="btnSave" onclick="saveAllEx()">💾 KAYDET VE GÖNDER</button>
        </div>
    </div>

    <div id="p-akis" class="app-page" style="display:none;">
        <table class="excel-table" id="mainExTable">
            <thead>
                <tr>
                    <th style="width:22%;">Lokasyon</th>
                    <th style="width:23%;">Ürün-Barkod</th>
                    <th style="width:14%;">Asistan</th>
                    <th style="width:20%;">KP NO</th>
                    <th style="width:21%;">FINART</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
    <div id="p-depo" class="app-page" style="display:none;">
        <div id="depoExList"></div>
    </div>
</div>

<div class="excel-nav">

    <div class="excel-nav-item" onclick="tabEx('akis', this)">📊 Akış</div>
    <div class="excel-nav-item" onclick="tabEx('depo', this)">📦 Depolar</div>

    let dynamicSubeler = [];

    function login() {
        const e = document.getElementById('email').value.trim().toLowerCase();
        const p = document.getElementById('pass').value;
        firebase.auth().signInWithEmailAndPassword(e, p).then(u => {
            uMail = e;
            const info = aracMap[e] || { ad: e.split('@')[0].toUpperCase(), kod: e.split('@')[0] };
            uName = info.ad; uFullKey = info.kod;
            document.getElementById('userTag').innerText = uName;
            document.getElementById('login-screen').style.display = 'none';
            if(uMail === "ekaradeniz@ziraatbank.com.tr") document.getElementById('btnSave').style.display = "none";
            addRowEx("GİRİŞ"); addRowEx("ÇIKIŞ");
            init();
        }).catch(() => alert("Giriş Hatalı!"));
    }

    function init() {
        db.ref('ayarlar/urun_listesi').on('value', snap => {
            let list = ["Cüzdan yazıcı","Pc","Tarayıcı","Monitör","Ip telefon","Switch","Router","Sunucu","Nvr","Laptop","Lazer yazıcı","Kamera"];
            snap.forEach(i => { if(!list.includes(i.val())) list.push(i.val()); });
            currentUrunler = list; updateAllSelects();
        });
        db.ref('ayarlar/sube_listesi').on('value', snap => {
            let list = []; snap.forEach(i => list.push(i.val()));
            dynamicSubeler = list; updateSubeCounter();
        });
        db.ref('transferler/canli_akis').on('value', snap => {
            const b = document.querySelector('#mainExTable tbody'); b.innerHTML = "";
            snap.forEach(i => {
                const d = i.val(); const key = i.key;
                const isD = d.status === "YAPILDI";
                const isOnay = d.status === "ONAY BEKLIYOR";
                const isReceiver = d.yer === uFullKey;

                let actionHtml = "";
                if(isOnay) {
                    actionHtml = isReceiver 
                        ? `<button class="btn-status bg-onay" onclick="approveTransfer('${key}')">KABUL ET</button>`
                        : `<span style="color:orange; font-weight:bold;">ONAYDA</span>`;
                } else {
                    actionHtml = `<button class="btn-status ${isD?'bg-done':'bg-waiting'}" onclick="db.ref('transferler/canli_akis/${key}').update({status:('${d.status}'==='BEKLEMEDE'?'YAPILDI':'BEKLEMEDE')})">${isD?'TAMAMLANDI':'BEKLİYOR'}</button>`;
                }

                b.innerHTML = `
                <tr class="${isD?'row-done':(isOnay?'row-onay':'row-waiting')}">
                    <td>${d.yer}</td>
                    <td><b>${d.urun}</b><br><small style="color:#555;">[${d.barkod}]</small></td>
                    <td>${d.gonderen}</td>
                    <td><input type="number" class="kp-input-large" onblur="db.ref('transferler/canli_akis/${key}').update({kp:this.value})" value="${d.kp||''}"></td>
                    <td>${actionHtml}</td>
                </tr>` + b.innerHTML;
            });
        });
        db.ref('depolar').on('value', snap => {
            const c = document.getElementById('depoExList'); c.innerHTML = "";
            myDepoBarkodlar = [];
            snap.forEach(d => {
                const isMyDepo = d.key === uFullKey;
                let rws = ""; 
                d.forEach(r => { 
                    const v = r.val(); 
                    if(isMyDepo) myDepoBarkodlar.push(String(v.barkod).trim());
                    rws += `<tr class="${isMyDepo?'depo-row':''}" onclick="${isMyDepo?`openTransferModal('${v.urun}','${v.barkod}')`:''}">
                        <td>${v.urun}</td>
                        <td>${v.barkod}</td>
                    </tr>`; 
                });
                c.innerHTML += `<div style="margin-bottom:10px; border:1px solid #ccc;"><div style="background:#217346; color:white; padding:8px; font-weight:bold;">📦 ${d.key} Arac Depo</div><table class="excel-table">${rws}</table></div>`;
            });
        });
        updateSubeCounter();
    }

    function manualAdd() {
        const n = prompt("Yeni Şube/Lokasyon İsmi (Kod ile birlikte)?");
        if(!n) return;
        const inputSube = n.toLocaleUpperCase('tr-TR').trim();
        // Hem statik hem dinamik listeyi büyük harfle kontrol et
        const allSubeler = [...staticSubeler, ...dynamicSubeler].map(s => s.toLocaleUpperCase('tr-TR').trim());
        
        if(allSubeler.includes(inputSube)) {
            alert("HATA: '" + inputSube + "' zaten listede mevcut!");
            return;
        }
        db.ref('ayarlar/sube_listesi').push(n.trim());
    }

    function openTransferModal(urun, barkod) {
        selectedItemForTransfer = { urun, barkod };
        document.getElementById('transfer-item-title').innerText = "Gönder: " + urun + " (" + barkod + ")";
        document.getElementById('transfer-modal').style.display = 'block';
        filterTransferList();
    }

    function closeTransferModal() { 
        document.getElementById('transfer-modal').style.display = 'none'; 
        selectedItemForTransfer = null;
    }

    function filterTransferList() {
        const ara = document.getElementById('transfer-ara').value.toLocaleUpperCase('tr-TR');
        const list = document.getElementById('transfer-list-body'); list.innerHTML = "";
        Object.values(aracMap).forEach(a => {
            if(a.kod !== uFullKey && (a.ad.includes(ara) || a.kod.toLocaleUpperCase('tr-TR').includes(ara))) {
                const d = document.createElement('div'); d.className = "sube-item"; 
                d.innerHTML = `🚛 <b>${a.ad}</b> (${a.kod})`;
                d.onclick = () => confirmTransfer(a.kod);
                list.appendChild(d);
            }
        });
        const all = [...staticSubeler, ...dynamicSubeler];
        all.filter(s => s.toLocaleUpperCase('tr-TR').includes(ara)).forEach(s => {
            const d = document.createElement('div'); d.className = "sube-item"; d.innerText = "🏢 " + s;
            d.onclick = () => confirmTransfer(s);
            list.appendChild(d);
        });
    }

    function confirmTransfer(target) {
        if(!selectedItemForTransfer) return;
        const isInterCar = Object.values(aracMap).some(a => a.kod === target);
        const status = isInterCar ? "ONAY BEKLIYOR" : "BEKLEMEDE";
        const data = { gonderen: uName, yer: target, tip: "ÇIKIŞ", barkod: selectedItemForTransfer.barkod, urun: selectedItemForTransfer.urun, status: status, kp: "", saat: new Date().toLocaleTimeString('tr-TR'), gonderen_kod: uFullKey };
        db.ref('transferler/canli_akis').push(data);
        alert(isInterCar ? "Transfer talebi gönderildi." : "İşlem akışa kaydedildi.");
        closeTransferModal();
        tabEx('akis', document.querySelectorAll('.excel-nav-item')[1]);
    }

    function approveTransfer(key) {
        db.ref('transferler/canli_akis/' + key).once('value', s => {
            const d = s.val();
            db.ref('depolar/' + d.gonderen_kod).once('value', ds => {
                ds.forEach(item => { if(item.val().barkod === d.barkod) item.ref.remove(); });
            });
            db.ref('depolar/' + uFullKey).push({ urun: d.urun, barkod: d.barkod });
            db.ref('transferler/canli_akis/' + key).update({status: "YAPILDI"});
        });
    }

    function addRowEx(type = "GİRİŞ") {
        const div = document.createElement('div'); div.className = "excel-row-container";
        div.innerHTML = `<select class="type-select ${type==='ÇIKIŞ'?'bg-out':'bg-in'}" onchange="this.classList.toggle('bg-out', this.value==='ÇIKIŞ'); this.classList.toggle('bg-in', this.value==='GİRİŞ')"><option value="GİRİŞ" ${type==='GİRİŞ'?'selected':''}>AL</option><option value="ÇIKIŞ" ${type==='ÇIKIŞ'?'selected':''}>VER</option></select><input type="number" placeholder="Barkod..." class="barkod-input"><select class="urun-select" onchange="checkNewUrun(this)"></select>`;
        document.getElementById('items-container').appendChild(div);
        updateAllSelects();
    }

    function updateAllSelects() {
        let list = currentUrunler;
        document.querySelectorAll('.urun-select').forEach(sel => {
            const old = sel.value;
            let h = ""; list.forEach(u => h += `<option value="${u}">${u}</option>`);
            sel.innerHTML = h + `<option value="ADD_NEW" style="color:#217346; font-weight:bold;">➕ YENİ ENVANTER EKLE</option>`;
            if(old && list.includes(old)) sel.value = old;
        });
    }

    function checkNewUrun(sel) {
        if(sel.value === "ADD_NEW") {
            const n = prompt("Yeni Envanter İsmi?");
            if(!n) { sel.selectedIndex = 0; return; }
            
            const inputUrun = n.toLocaleUpperCase('tr-TR').trim();
            const existingUrunler = currentUrunler.map(u => u.toLocaleUpperCase('tr-TR').trim());
            
            if(existingUrunler.includes(inputUrun)) {
                alert("HATA: '" + inputUrun + "' zaten listede mevcut!");
                // Mevcut olanı bul ve seç
                const originalName = currentUrunler.find(u => u.toLocaleUpperCase('tr-TR').trim() === inputUrun);
                sel.value = originalName;
                return;
            }
            db.ref('ayarlar/urun_listesi').push(n.trim()); 
            setTimeout(() => sel.value = n, 500);
        }
    }

    function saveAllEx() {
        const target = document.getElementById('target-sube').value;
        const isToMyTruck = document.getElementById('to-my-truck').checked;
        
        if(!target || target === "Hedef Şube Seçin") return alert("Lütfen bir şube seçin!");
        
        let savedCount = 0;
        let duplicateCount = 0;

        document.querySelectorAll('.excel-row-container').forEach(row => {
            const b = String(row.querySelector('.barkod-input').value).trim();
            const u = row.querySelector('.urun-select').value;
            const t = row.querySelector('.type-select').value;
            
            if(b) {
                // Aracıma transferde mükerrer barkod kontrolü
                if(isToMyTruck && myDepoBarkodlar.includes(b)) {
                    duplicateCount++;
                    return; 
                }

                const data = { gonderen: uName, yer: target, tip: t, barkod: b, urun: u, status: "BEKLEMEDE", kp: "", saat: new Date().toLocaleTimeString('tr-TR'), gonderen_kod: uFullKey };
                
                if(isToMyTruck) {
                    db.ref('depolar/' + uFullKey).push({ urun: data.urun, barkod: data.barkod });
                } else {
                    db.ref('transferler/canli_akis').push(data);
                }
                savedCount++;
            }
        });

        if(savedCount > 0) {
            let info = isToMyTruck ? "Ürünler aracınıza kaydedildi." : "Kayıtlar başarıyla akışa gönderildi.";
            if(duplicateCount > 0) info += "\n(Not: " + duplicateCount + " adet mükerrer barkod depoda olduğu için atlandı.)";
            alert(info);
            document.getElementById('items-container').innerHTML = ""; 
            addRowEx("GİRİŞ"); 
            addRowEx("ÇIKIŞ");
        } else if(duplicateCount > 0) {
            alert("HATA: Girdiğiniz tüm barkodlar zaten aracınızın deposunda mevcut!");
        } else {
            alert("Lütfen en az bir barkod girin!");
        }
    }

    function openModal() { document.getElementById('sube-modal').style.display = 'block'; filterSubeler(); }
    function closeModal() { document.getElementById('sube-modal').style.display = 'none'; }
    
    function filterSubeler() {
        const ara = document.getElementById('sube-ara').value.toLocaleUpperCase('tr-TR');
        const list = document.getElementById('modal-list-body'); list.innerHTML = "";
        const all = [...staticSubeler, ...dynamicSubeler];
        all.filter(s => s.toLocaleUpperCase('tr-TR').includes(ara)).forEach(s => {
            const d = document.createElement('div'); d.className = "sube-item"; d.innerText = s; d.onclick = () => { document.getElementById('target-sube').value = s; closeModal(); };
            list.appendChild(d);
        });
    }

    function toggleTruckMode() {
        const isT = document.getElementById('to-my-truck').checked;
        document.getElementById('target-sube').value = isT ? uFullKey : "";
        document.getElementById('target-sube').style.opacity = isT ? "0.5" : "1";
    }

    function updateSubeCounter() {
        const total = staticSubeler.length + dynamicSubeler.length;
        document.getElementById('target-sube').placeholder = `Hedef Şube Seçin (${total})`;
    }

    function tabEx(id, el) {
        document.querySelectorAll('.app-page').forEach(p => p.style.display = 'none');
        document.getElementById('p-'+id).style.display = 'block';
        document.querySelectorAll('.excel-nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }
</script>
</body>
</html>
