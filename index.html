    function startScannerEx(targetInputId) {
        document.getElementById('camera-modal').style.display = 'flex';
        
        try {
            html5QrcodeScannerEx = new Html5Qrcode("reader");

            html5QrcodeScannerEx.start(
                { facingMode: "environment" },
                { 
                    fps: 20, 
                    qrbox: { width: 300, height: 100 },
                    experimentalFeatures: { useBarCodeDetectorIfSupported: true } 
                },
                (decodedText) => {
                    const input = document.getElementById(targetInputId);
                    if(input) {
                        input.value = decodedText;
                        if(targetInputId.startsWith('kp-')) {
                            const dbKey = targetInputId.replace('kp-', '');
                            db.ref('transferler/canli_akis/' + dbKey).update({kp: decodedText});
                        }
                    }
                    stopScannerEx();
                }
            ).catch(err => { 
                console.error("Kamera açılamadı:", err);
                alert("Kamera başlatılamadı! Lütfen tarayıcı izinlerinizi kontrol edin.");
                stopScannerEx(); 
            });
        } catch (e) {
            console.error("Barkod kütüphanesi hatası:", e);
            alert("Barkod okuyucu yüklenirken bir hata oluştu.");
            stopScannerEx();
        }
    }

    function stopScannerEx() {
        if(html5QrcodeScannerEx) {
            html5QrcodeScannerEx.stop().then(() => {
                html5QrcodeScannerEx = null;
                document.getElementById('camera-modal').style.display = 'none';
            }).catch(() => {

            });
        } else {
            document.getElementById('camera-modal').style.display = 'none';
        }

    function formatKP(text) {
        if(!text) return "";
        let parts = text.split(' ');
        if(/^\d+$/.test(parts[0])) {
            return parts.slice(1).join(' ')
                        .replace(/-İzmir Şubesi/gi, '')
                        .replace(/-Manisa Şubesi/gi, '')
                        .replace(/Şubesi/gi, '')
                        .trim();
        }
        return text; 
    }

    }

    function init() {
        db.ref('ayarlar/urun_listesi').on('value', snap => { updateAllSelects(); });
        db.ref('ayarlar/sube_listesi').on('value', snap => {
            let list = []; snap.forEach(i => list.push(i.val()));
            dynamicSubeler = list; updateSubeCounter();
        });

        db.ref('transferler/canli_akis').on('value', snap => {
            const container = document.getElementById('akis-container');
            if(!container) return;
            
            const groupedData = {};
            const groupOrder = [];
            
            snap.forEach(i => {
                const d = i.val();
                const key = i.key;
                
                const tarih = d.tarih || "";
                const saat = d.saat || "";
                const groupKey = d.yer + "|||" + tarih + "|||" + saat;
                
                if(!groupedData[groupKey]) {
                    groupedData[groupKey] = [];
                }
                
                groupedData[groupKey].unshift({ key, d });

                const idx = groupOrder.indexOf(groupKey);
                if(idx > -1) {
                    groupOrder.splice(idx, 1);
                }
                groupOrder.unshift(groupKey);
            });

            currentAkisData = groupedData;

            let fullHtml = "";

            groupOrder.forEach(gKey => {
                const parts = gKey.split("|||");
                const yer = parts[0];
                const tarih = parts[1];
                const saat = parts[2];

                const gonderenIsmi = groupedData[gKey][0].d.gonderen || "Bilinmiyor";

                let rowsHtml = "";
                groupedData[gKey].forEach(item => {
                    const key = item.key;
                    const d = item.d;
                    const isD = d.status === "YAPILDI";
                    const isOnay = d.status === "ONAY BEKLIYOR";
                    const isReceiver = d.yer === uFullKey;
                    const isPassiveKP = (d.tip === "ÇIKIŞ" || d.tip === "VER");

                    let actionHtml = "";
                    if(isOnay) {
                        actionHtml = isReceiver 
                            ? `<button class="btn-status bg-onay" onclick="approveTransfer('${key}')">KABUL ET</button>`
                            : `<span style="color:orange; font-weight:bold;">ONAYDA</span>`;
                    } else {
                        actionHtml = `<button class="btn-status ${isD?'bg-done':'bg-waiting'}" onclick="db.ref('transferler/canli_akis/${key}').update({status:('${d.status}'==='BEKLEMEDE'?'YAPILDI':'BEKLEMEDE')})">${isD?'YAPILDI':'BEKLİYOR'}</button>`;
                    }

                    let kpCell = "";
                    if(isPassiveKP) {
                        kpCell = `<input type="text" class="kp-input-large" readonly style="background:#eee; border:none; color:#666;" value="${d.kp||''}">`;
                    } else {
                        kpCell = `
                            <div class="kp-wrapper">
                                <input type="text" id="kp-${key}" class="kp-input-large" onblur="db.ref('transferler/canli_akis/${key}').update({kp:this.value})" value="${d.kp||''}">
                                <span class="magnifier-btn" onclick="startScannerEx('kp-${key}')">🔍</span>
                            </div>`;
                    }

                    const checkMark = isD ? ' <span style="font-size:12px;">✅</span>' : '';

                    rowsHtml += `
                    <tr class="${isD?'row-done':(isOnay?'row-onay':'row-waiting')}">
                        <td style="width:30%;"><b>${d.urun}</b><br><small style="color:#555;">${d.barkod}${checkMark}</small></td>
                        <td style="width:20%; font-weight:bold;">${d.personel || '-'}</td>
                        <td style="width:25%;">${kpCell}</td>
                        <td style="width:25%;">${actionHtml}</td>
                    </tr>`;
                });

                fullHtml += `
                <div style="margin-bottom:15px; border:1px solid var(--excell-green); border-radius:4px; overflow:hidden; background:#fff;">
                    <div class="akis-group-header" style="background:var(--excell-green); color:white; padding:8px 10px; font-weight:bold; font-size:12px; display:flex; justify-content:space-between; align-items:center; user-select:none;">
                        <div style="display:flex; flex-direction:column; gap:3px; flex:1;">
                            <span>🏢 ${yer}</span>
                            <span style="font-size:10px; font-weight:normal; opacity:0.9;">📅 ${tarih} - ⏰ ${saat}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div style="display:flex; flex-direction:column; align-items:flex-end;">
                                <span style="font-size:8px; opacity:0.8; font-weight:normal; letter-spacing:0.5px;">TEKNİKER</span>
                                <span style="font-size:11px;">${gonderenIsmi}</span>
                            </div>
                            <button class="btn-circle" onclick="openAkisMenu(event, '${gKey}')">⋮</button>
                        </div>
                    </div>
                    <table class="excel-table" style="border:none;">
                        <thead>
                            <tr>
                                <th style="width:30%;">Ürün-Barkod</th>
                                <th style="width:20%;">Personel</th>
                                <th style="width:25%;">KP NO</th>
                                <th style="width:25%;">Transfer</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>`;
            });
            
            container.innerHTML = fullHtml;
            
            if(document.getElementById('akis-ara') && document.getElementById('akis-ara').value !== '') {
                filterAkis();
            }
        });

        db.ref('depolar').on('value', snap => {
            const c = document.getElementById('depoExList'); c.innerHTML = "";
            snap.forEach(d => {
                const isMyDepo = d.key === uFullKey;
                let rws = ""; 
                d.forEach(r => { 
                    const v = r.val(); 
                    rws += `<tr class="${isMyDepo?'depo-row':''}" onclick="${isMyDepo?`openTransferModal('${v.urun}','${v.barkod}')`:''}">
                        <td>${v.urun}</td>
                        <td>${v.barkod}</td>
                    </tr>`; 
                });
                c.innerHTML += `<div style="margin-bottom:10px; border:1px solid #ccc;"><div style="background:#217346; color:white; padding:8px; font-weight:bold;">📦 ${d.key} Arac Depo</div><table class="excel-table">${rws}</table></div>`;
            });
        });
        updateSubeCounter();
    }

    function openAkisMenu(e, gKey) {
        e.stopPropagation();
        selectedAkisGKey = gKey;
        const menu = document.getElementById('akis-context-menu');
        menu.style.display = 'flex';
        
        const x = e.pageX - 160; 
        const y = e.pageY + 10;
        
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
        
        if ("vibrate" in navigator) navigator.vibrate(50);

        setTimeout(() => {
            document.addEventListener('click', function closeMenu(ev) {
                if (!ev.target.closest('#akis-context-menu')) {
                    menu.style.display = 'none';
                    document.removeEventListener('click', closeMenu);
                }
            });
        }, 10);
    }

    async function sendAkisMail() {
        document.getElementById('akis-context-menu').style.display = 'none';
        if(!selectedAkisGKey || !currentAkisData[selectedAkisGKey]) return;

        const groupData = currentAkisData[selectedAkisGKey];
        
        let takilanlar = [];
        let alinanlar = [];
        let persIsmi = groupData[0].d.personel || "";
        if (persIsmi === "-") persIsmi = "";

        groupData.forEach(item => {
            if(item.d.tip === "ÇIKIŞ" || item.d.tip === "VER") {
                takilanlar.push(item.d.barkod || item.d.urun);
            }
            if(item.d.tip === "GİRİŞ" || item.d.tip === "AL") {
                alinanlar.push(item.d.barkod || item.d.urun);
            }
        });

        const bodyText = `Sayın Yetkili,\n\nArızalı olan cihazın değişimi gerçekleştirilmiş olup, envanter bilgileri aşağıda yer almaktadır.\n\nTakılan: ${takilanlar.join(', ')}\nArızalı : ${alinanlar.join(', ')}\n\nBilgilerinize,\nİyi çalışmalar.`;

        try {
            await navigator.clipboard.writeText(bodyText);
            alert("✅ İçerik panoya kopyalandı!\nE-posta uygulamanız açılıyor...");
        } catch (err) {
            console.error("Panoya kopyalanamadı:", err);
            alert("Metin panoya otomatik kopyalanamadı. Lütfen manuel olarak kopyalayın.\n\n" + bodyText);
        }

        const to = "btsahaoperasyonlariyonetimiyetkili@ziraatbank.com.tr";
        const subject = "Envanter Transferi S016 Hk.";
        
        let ccText = "btizmirsahabakim@ziraatbank.com.tr";
        if (persIsmi !== "") {
            ccText += ";" + persIsmi;
        }

        const mailtoLink = "mailto:" + to + "?cc=" + encodeURIComponent(ccText) + "&subject=" + encodeURIComponent(subject);
        
        window.location.href = mailtoLink;
    }

    function deleteAkisGroup() {
        document.getElementById('akis-context-menu').style.display = 'none';
        if(!selectedAkisGKey || !currentAkisData[selectedAkisGKey]) return;

        if(confirm("Bu gruba ait tüm işlemleri kalıcı olarak silmek istediğinize emin misiniz?")) {
            const groupData = currentAkisData[selectedAkisGKey];
            groupData.forEach(item => {
                db.ref('transferler/canli_akis/' + item.key).remove();
            });
        }
    }

    function addRowEx(type = "ÇIKIŞ") {
        const rowId = 'brk-' + Math.random().toString(36).substr(2, 9);
        const div = document.createElement('div'); 
        div.className = "excel-row-container";
        div.innerHTML = `
            <select class="type-select ${type==='ÇIKIŞ'?'bg-out':'bg-in'}" onchange="this.classList.toggle('bg-out', this.value==='ÇIKIŞ'); this.classList.toggle('bg-in', this.value==='GİRİŞ')">
                <option value="ÇIKIŞ" ${type==='ÇIKIŞ'?'selected':''}>VER</option>
                <option value="GİRİŞ" ${type==='GİRİŞ'?'selected':''}>AL</option>
            </select>
            <div class="scan-container">
                <input type="number" id="${rowId}" placeholder="Barkod..." class="barkod-input">
                <span class="magnifier-btn" onclick="startScannerEx('${rowId}')">🔍</span>
            </div>
            <select class="urun-select" onchange="checkNewUrun(this)"></select>`;
            
        document.getElementById('items-container').appendChild(div);
        updateAllSelects();
    }

    function manualAdd() { const n = prompt("Yeni Şube/Lokasyon?"); if(n) db.ref('ayarlar/sube_listesi').push(n); }
    function openTransferModal(urun, barkod) { selectedItemForTransfer = { urun, barkod }; document.getElementById('transfer-item-title').innerText = "Gönder: " + urun; document.getElementById('transfer-modal').style.display = 'block'; filterTransferList(); }
    function closeTransferModal() { document.getElementById('transfer-modal').style.display = 'none'; selectedItemForTransfer = null; }
    function openModal() { document.getElementById('sube-modal').style.display = 'block'; filterSubeler(); }
    function closeModal() { document.getElementById('sube-modal').style.display = 'none'; }
    function checkNewUrun(sel) { if(sel.value === "ADD_NEW") { const n = prompt("Yeni Envanter?"); if(n) { db.ref('ayarlar/urun_listesi').push(n); setTimeout(() => sel.value = n, 500); } else sel.selectedIndex = 0; } }

    function filterTransferList() {
        const ara = document.getElementById('transfer-ara').value.toLocaleUpperCase('tr-TR');
        const list = document.getElementById('transfer-list-body'); list.innerHTML = "";
        Object.values(aracMap).forEach(a => {
            if(a.kod !== uFullKey && (a.ad.includes(ara) || a.kod.toLocaleUpperCase('tr-TR').includes(ara))) {
                const d = document.createElement('div'); d.className = "sube-item"; d.innerHTML = `🚛 <b>${a.ad}</b> (${a.kod})`; d.onclick = () => confirmTransfer(a.kod); list.appendChild(d);
            }
        });
        const all = [...staticSubeler, ...dynamicSubeler];
        all.filter(s => s.toLocaleUpperCase('tr-TR').includes(ara)).forEach(s => {
            const d = document.createElement('div'); d.className = "sube-item"; d.innerText = "🏢 " + s; d.onclick = () => confirmTransfer(s); list.appendChild(d);
        });
    }

    function confirmTransfer(target) {
        if(!selectedItemForTransfer) return;
        const isInterCar = Object.values(aracMap).some(a => a.kod === target);
        const status = isInterCar ? "ONAY BEKLIYOR" : "BEKLEMEDE";
        const kpFormatted = formatKP(target);
        
        const now = new Date();
        const tarih = now.toLocaleDateString('tr-TR');
        const saat = now.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});

        const data = { 
            gonderen: uName, 
            yer: target, 
            personel: "-", 
            tip: "ÇIKIŞ", 
            barkod: selectedItemForTransfer.barkod, 
            urun: selectedItemForTransfer.urun, 
            status: status, 
            kp: kpFormatted, 
            tarih: tarih, 
            saat: saat, 
            gonderen_kod: uFullKey 
        };
        db.ref('transferler/canli_akis').push(data);
        alert("İşlem akışa kaydedildi.");
        closeTransferModal();
        tabEx('akis', document.querySelectorAll('.excel-nav-item')[1]);
    }

    function approveTransfer(key) {
        db.ref('transferler/canli_akis/' + key).once('value', s => {
            const d = s.val();
            db.ref('depolar/' + d.gonderen_kod).once('value', ds => { ds.forEach(item => { if(item.val().barkod === d.barkod) item.ref.remove(); }); });
            db.ref('depolar/' + uFullKey).push({ urun: d.urun, barkod: d.barkod });
            db.ref('transferler/canli_akis/' + key).update({status: "YAPILDI"});
        });
    }

    function updateAllSelects() {
        db.ref('ayarlar/urun_listesi').once('value', snap => {
            let list = ["Cüzdan yazıcı","Pc","Tarayıcı","Monitör","Ip telefon","Switch","Router","Sunucu","Nvr","Laptop","Lazer yazıcı","Kamera"];
            snap.forEach(i => { if(!list.includes(i.val())) list.push(i.val()); });
            document.querySelectorAll('.urun-select').forEach(sel => {
                const old = sel.value;
                let h = ""; list.forEach(u => h += `<option value="${u}">${u}</option>`);
                sel.innerHTML = h + `<option value="ADD_NEW" style="color:#217346; font-weight:bold;">➕ YENİ ENVANTER EKLE</option>`;
                if(old && list.includes(old)) sel.value = old;
            });
        });
    }

    async function saveAllEx() {
        const target = document.getElementById('target-sube').value;
        const pers = document.getElementById('personel-name').value.trim();
        const toMyTruck = document.getElementById('to-my-truck').checked;
        
        if(!toMyTruck && (!target || target === "Hedef Lokasyon Seçin")) return alert("Lütfen bir lokasyon seçin!");
        
        if(!toMyTruck && !pers) return alert("Lütfen Personel İsmi giriniz!");

        let currentDepoBarkodlar = [];
        if (toMyTruck) {
            const snapshot = await db.ref('depolar/' + uFullKey).once('value');
            snapshot.forEach(child => { currentDepoBarkodlar.push(String(child.val().barkod).trim()); });
        }

        let addedCount = 0;
        const kpFormatted = formatKP(target);
        
        const now = new Date();
        const tarih = now.toLocaleDateString('tr-TR');
        const saat = now.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});

        const rowElements = Array.from(document.querySelectorAll('.excel-row-container')).reverse();

        rowElements.forEach(row => {
            const b = String(row.querySelector('.barkod-input').value).trim();
            const u = row.querySelector('.urun-select').value;
            const type = row.querySelector('.type-select').value;
            if(b) {
                if(toMyTruck) {
                    if (!currentDepoBarkodlar.includes(b)) { 
                        db.ref('depolar/' + uFullKey).push({ urun: u, barkod: b }); 
                        currentDepoBarkodlar.push(b); addedCount++; 
                    }
                } else {
                    const kpVal = (type === "ÇIKIŞ") ? kpFormatted : "";
                    const data = { 
                        gonderen: uName, 
                        yer: target, 
                        personel: pers,
                        tip: type, 
                        barkod: b, 
                        urun: u, 
                        status: "BEKLEMEDE", 
                        kp: kpVal, 
                        tarih: tarih,
                        saat: saat, 
                        gonderen_kod: uFullKey 
                    };
                    db.ref('transferler/canli_akis').push(data);
                    addedCount++;
                }
            }
        });

        if (addedCount > 0) { 
            document.getElementById('items-container').innerHTML = ""; 
            document.getElementById('personel-name').value = "";
            addRowEx("ÇIKIŞ"); 
            addRowEx("GİRİŞ"); 
        }
        alert(addedCount > 0 ? "Başarıyla kaydedildi." : "Kaydedilecek veri yok.");
    }

    function filterSubeler() {
        const ara = document.getElementById('sube-ara').value.toLocaleUpperCase('tr-TR');
        const list = document.getElementById('modal-list-body'); list.innerHTML = "";
        const all = [...staticSubeler, ...dynamicSubeler];
        all.filter(s => s.toLocaleUpperCase('tr-TR').includes(ara)).forEach(s => {
            const d = document.createElement('div'); d.className = "sube-item"; d.innerText = s; d.onclick = () => { document.getElementById('target-sube').value = s; closeModal(); };
            list.appendChild(d);
        });
    }

    function toggleTruckMode() { 
        const isT = document.getElementById('to-my-truck').checked; 
        document.getElementById('target-sube').value = isT ? uFullKey : ""; 
        document.getElementById('target-sube').style.opacity = isT ? "0.6" : "1"; 
        document.getElementById('personel-name').style.display = isT ? "none" : "block";
    }
    
    function updateSubeCounter() { const total = staticSubeler.length + dynamicSubeler.length; document.getElementById('target-sube').placeholder = `📍 Hedef Lokasyon Seçin (${total})`; }
    function tabEx(id, el) { document.querySelectorAll('.app-page').forEach(p => p.style.display = 'none'); document.getElementById('p-'+id).style.display = 'block'; document.querySelectorAll('.excel-nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }

    function filterAkis() {
        const ara = document.getElementById('akis-ara').value.toLocaleUpperCase('tr-TR');
        const wrappers = document.querySelectorAll('#akis-container > div');

        wrappers.forEach(wrapper => {
            const locationHeader = wrapper.querySelector('div').innerText.toLocaleUpperCase('tr-TR');
            const rows = wrapper.querySelectorAll('tbody tr');
            let hasVisibleRow = false;

            const locationMatch = locationHeader.includes(ara);

            rows.forEach(row => {
                const rowText = row.innerText.toLocaleUpperCase('tr-TR');
                if (locationMatch || rowText.includes(ara)) {
                    row.style.display = '';
                    hasVisibleRow = true;
                } else {
                    row.style.display = 'none';
                }
            });

            if (hasVisibleRow || locationMatch) {
                wrapper.style.display = '';
            } else {
                wrapper.style.display = 'none';
            }
        });
    }
</script>
