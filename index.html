<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FINART S016 Depo v73</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <style>
        :root { --excell-green: #217346; --border: #d4d4d4; --bg: #f3f3f3; }
        .bg-in { background-color: #d9e9f3 !important; color: #0078d4 !important; }
        .bg-out { background-color: #f8dbdb !important; color: #d83b01 !important; }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; font-size: 11px; }
        body { margin: 0; background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Modallar */
        #transfer-modal, #sube-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:2000; padding:20px; }
        .modal-box { background:white; border-radius:8px; height:85vh; display:flex; flex-direction:column; overflow:hidden; }
        .modal-search { padding:15px; border-bottom:1px solid #eee; background: #f9f9f9; }
        .modal-search input { width:100%; padding:12px; border:2px solid var(--excell-green); border-radius:4px; font-size:14px; outline: none; }
        .modal-list { flex:1; overflow-y:auto; }
        .sube-item { padding:15px; border-bottom:1px solid #f0f0f0; font-size:13px; color: #333; cursor: pointer; }
        .sube-item:active { background: #e8f5e9; }

        /* Başlık Çubuğu */
        .excel-bar { background: var(--excell-green); color: white; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .finart-title { font-weight: bold; font-size: 14px; letter-spacing: 1px; }
        .user-cell { background: #fff; color: #333; padding: 3px 10px; border: 1px solid #999; font-weight: bold; border-radius: 2px; }
        
        .content { flex: 1; overflow-y: auto; padding: 5px; padding-bottom: 70px; }
        
        /* Tablo ve Akış */
        .excel-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; }
        .excel-table th, .excel-table td { border: 1px solid var(--border); padding: 8px 4px; text-align: left; }
        .excel-table th { background: #ebf1de; font-size: 10px; font-weight: bold; color: #444; }
        
        .row-waiting { background-color: #f8d7da !important; }
        .row-onay { background-color: #fff3cd !important; }
        .row-done { background-color: #d4edda !important; color: #155724; font-weight: bold; }
        
        .btn-status { width: 100%; padding: 8px 2px; border: none; border-radius: 3px; font-weight: bold; color: white; cursor: pointer; }
        .bg-waiting { background: #dc3545; }
        .bg-onay { background: #ff9800; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% {opacity: 1;} 50% {opacity: 0.7;} 100% {opacity: 1;} }

        /* Form Yapısı */
        .excel-row-container { display: flex; border: 1px solid #ccc; background: #fff; margin-bottom: 3px; min-height: 44px; align-items: center; border-radius: 4px; }
        .type-select { width: 60px; height: 44px; border: none; border-right: 1px solid #ccc; font-weight: bold; text-align: center; }
        .barkod-input { flex: 2; height: 44px; border: none; border-right: 1px solid #ccc; padding: 0 10px; font-size: 13px; outline: none; }
        .urun-select { flex: 2; height: 44px; border: none; padding-left: 5px; font-weight: bold; background: transparent; outline: none; }

        .btn-excel-save { width: 100%; padding: 15px; background: var(--excell-green); color: white; font-weight: bold; border: none; border-radius: 4px; margin-top: 10px; }
        
        /* Navigasyon */
        .excel-nav { height: 55px; background: #fff; border-top: 1px solid var(--border); display: flex; position: fixed; bottom: 0; width: 100%; }
        .excel-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; }
        .excel-nav-item.active { background: #f0f0f0; color: var(--excell-green); font-weight: bold; border-top: 3px solid var(--excell-green); }
        
        #login-screen { position: fixed; inset: 0; background: var(--excell-green); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="finart-title" style="font-size: 24px; margin-bottom: 20px;">FINART</div>
    <input type="email" id="email" placeholder="E-posta" style="width:80%; margin-bottom:10px; padding:12px; border-radius:4px; border:none;">
    <input type="password" id="pass" placeholder="Şifre" style="width:80%; margin-bottom:20px; padding:12px; border-radius:4px; border:none;">
    <button onclick="login()" style="width:80%; padding:15px; font-weight:bold; background:white; color:var(--excell-green); border:none; border-radius:4px;">GİRİŞ YAP</button>
</div>

<div id="sube-modal">

</div>

<div id="transfer-modal">

        <div class="modal-search"><h3 id="transfer-info">Ürün Gönder</h3></div>
        <div class="modal-list" id="transfer-list-body"></div>
        <button onclick="closeTransferModal()" style="padding:15px; background:#444; color:white; border:none; font-weight:bold;">VAZGEÇ</button>
    </div>
</div>

<div class="excel-bar">
    <div class="finart-title">FINART S016</div>
    <div class="user-cell" id="userTag">...</div>
</div>

<div class="content">
    <div id="p-islem" class="app-page">
        <div style="background:#fff; padding:10px; border:1px solid #ccc; margin-bottom:5px; border-radius:4px;">
            <input type="text" id="target-sube" placeholder="Hedef Şube Seçin" readonly onclick="openModal()" style="width:100%; margin-bottom:10px; padding:12px; background:#fffde7; border:1px solid #ccc; font-weight:bold; border-radius:4px;">
            <label style="display:flex; align-items:center; gap:10px; color:var(--excell-green); font-weight:bold;">
                <input type="checkbox" id="to-my-truck" onchange="toggleTruckMode()"> 🚛 ARACIMA ALIYORUM
            </label>
        </div>
        <div id="items-container"></div>
        <button style="width:100%; padding:10px; margin-top:5px; background:#eee; border:1px dashed #999;" onclick="addRowEx()">+ Satır Ekle</button>
        <div onclick="addNewUrun()" style="padding:8px; text-align:right; color:blue; text-decoration:underline;">+ Yeni Ürün Tanımla</div>
        <button class="btn-excel-save" id="saveSection" onclick="saveAllEx()">💾 KAYDET VE GÖNDER</button>
    </div>

    <div id="p-akis" class="app-page" style="display:none;">
        <table class="excel-table">
            <thead>
                <tr>
                    <th style="width:25%;">Lokasyon</th>
                    <th style="width:30%;">Ürün/Barkod</th>
                    <th style="width:20%;">KP NO</th>
                    <th style="width:25%; text-align:center;">DURUM</th>
                </tr>
            </thead>
            <tbody id="akisBody"></tbody>
        </table>
    </div>
    
    <div id="p-depo" class="app-page" style="display:none;">
        <div id="depoExList"></div>
    </div>
</div>

<div class="excel-nav">

    function login() {
        const e = document.getElementById('email').value.trim().toLowerCase();
        const p = document.getElementById('pass').value;
        firebase.auth().signInWithEmailAndPassword(e, p).then(u => {
            uMail = e;
            const info = aracMap[e] || { ad: e.split('@')[0].toUpperCase(), kod: e.split('@')[0] };
            uName = info.ad; uFullKey = info.kod;
            document.getElementById('userTag').innerText = uName;
            document.getElementById('login-screen').style.display = 'none';
            if(uMail === "ekaradeniz@ziraatbank.com.tr") document.getElementById('saveSection').style.display = "none";
            addRowEx("GİRİŞ"); addRowEx("ÇIKIŞ");
            init();
        }).catch(() => alert("Hatalı Giriş!"));
    }

    function init() {
        db.ref('ayarlar/urun_listesi').on('value', snap => {
            urunListesi = ["Cüzdan yazıcı","Pc","Tarayıcı","Monitör","Ip telefon","Switch","Router","Sunucu","Nvr","Laptop","Lazer yazıcı","Kamera"];
            snap.forEach(i => { if(!urunListesi.includes(i.val())) urunListesi.push(i.val()); });
            updateAllSelects();
        });

        db.ref('ayarlar/sube_listesi').on('value', snap => {
            dynamicSubeler = []; snap.forEach(i => dynamicSubeler.push(i.val()));
        });

        db.ref('transferler/canli_akis').on('value', snap => {
            const b = document.getElementById('akisBody'); b.innerHTML = "";
            snap.forEach(i => {
                const d = i.val();
                const isDone = d.status === "YAPILDI";
                const isOnay = d.status === "ONAY BEKLIYOR";
                const isTargetMe = d.yer === uFullKey;

                let actionHtml = "";
                if(isDone) {
                    actionHtml = "<span style='color:green;'>✅ TRANSFER TAMAMLANDI</span>";
                } else if(isOnay) {
                    actionHtml = isTargetMe 
                        ? `<button class="btn-status bg-onay" onclick="approveDirect('${i.key}')">KABUL ET</button>`
                        : `<div style="text-align:center; color:orange; font-weight:bold;">⏳ ONAY BEKLİYOR</div>`;
                } else {
                    actionHtml = `<button class="btn-status ${isDone?'bg-done':'bg-waiting'}" onclick="toggleStatus('${i.key}','${d.status}')">BEKLEMEDE</button>`;
                }

                b.innerHTML = `<tr class="${isDone?'row-done':(isOnay?'row-onay':'row-waiting')}">
                    <td>${d.yer}</td>
                    <td><b>${d.urun}</b><br><small>${d.barkod}</small></td>
                    <td><input type="number" style="width:100%;" value="${d.kp||''}" onblur="db.ref('transferler/canli_akis/${i.key}').update({kp:this.value})"></td>
                    <td style="text-align:center;">${actionHtml}</td>
                </tr>` + b.innerHTML;
            });
        });

        db.ref('depolar').on('value', snap => {
            const list = document.getElementById('depoExList'); list.innerHTML = "";
            snap.forEach(d => {
                const isMyDepo = d.key === uFullKey;
                let rows = "";
                d.forEach(item => {
                    const v = item.val();
                    rows += `<tr style="cursor:pointer" onclick="${isMyDepo?`startTransfer('${v.urun}','${v.barkod}')`:''}">
                        <td>${v.urun}</td><td>${v.barkod}</td>
                    </tr>`;
                });
                list.innerHTML += `<div style="margin-bottom:10px; border:1px solid #ccc;">
                    <div style="background:var(--excell-green); color:white; padding:8px; font-weight:bold;">📦 ${d.key}</div>
                    <table class="excel-table">${rows}</table></div>`;
            });
        });
    }

    function addRowEx(type = "GİRİŞ") {
        const div = document.createElement('div'); div.className = "excel-row-container";
        div.innerHTML = `
            <select class="type-select ${type==='ÇIKIŞ'?'bg-out':'bg-in'}">
                <option value="GİRİŞ" ${type==='GİRİŞ'?'selected':''}>AL</option>
                <option value="ÇIKIŞ" ${type==='ÇIKIŞ'?'selected':''}>VER</option>
            </select>
            <input type="number" placeholder="Barkod..." class="barkod-input">
            <select class="urun-select"></select>`;
        document.getElementById('items-container').appendChild(div);
        updateAllSelects();
    }

    function updateAllSelects() {
        document.querySelectorAll('.urun-select').forEach(sel => {
            const old = sel.value;
            let h = ""; urunListesi.forEach(u => h += `<option value="${u}">${u}</option>`);
            sel.innerHTML = h; if(old) sel.value = old;
        });
    }

    function addNewSube() {
        const s = prompt("Yeni Şube Adı:");
        if(s) db.ref('ayarlar/sube_listesi').push(s.toUpperCase());
    }

    function addNewUrun() {
        const u = prompt("Yeni Ürün Adı:");
        if(u) db.ref('ayarlar/urun_listesi').push(u);
    }

    function saveAllEx() {
        const target = document.getElementById('target-sube').value;
        if(!target) return alert("Şube seçilmedi!");
        document.querySelectorAll('.excel-row-container').forEach(row => {
            const b = row.querySelector('.barkod-input').value;
            const u = row.querySelector('.urun-select').value;
            const t = row.querySelector('.type-select').value;
            if(b) {
                db.ref('transferler/canli_akis').push({
                    gonderen: uName, gonderen_kod: uFullKey, yer: target,
                    urun: u, barkod: b, tip: t, status: "BEKLEMEDE", kp: ""
                });
                if(document.getElementById('to-my-truck').checked) db.ref('depolar/' + uFullKey).push({urun:u, barkod:b});
            }
        });
        document.getElementById('items-container').innerHTML = ""; addRowEx("GİRİŞ"); addRowEx("ÇIKIŞ");
    }

    function toggleStatus(key, cur) {
        if(confirm("İşlem tamamlandı olarak işaretlensin mi?")) {
            db.ref('transferler/canli_akis/' + key).update({ status: "YAPILDI" });
        }
    }

    function approveDirect(key) {
        db.ref('transferler/canli_akis/' + key).once('value', snap => {
            const d = snap.val();
            // Gönderenin deposundan sil
            db.ref('depolar/' + d.gonderen_kod).once('value', s => {
                s.forEach(i => { if(i.val().barkod === d.barkod) i.ref.remove(); });
            });
            // Alanın (benim) depoma ekle
            db.ref('depolar/' + uFullKey).push({ urun: d.urun, barkod: d.barkod });
            db.ref('transferler/canli_akis/' + key).update({ status: "YAPILDI" });
        });
    }

    function openModal() { document.getElementById('sube-modal').style.display = 'block'; filterSubeler(); }
    function closeModal() { document.getElementById('sube-modal').style.display = 'none'; }
    
    function filterSubeler() {
        const ara = document.getElementById('sube-ara').value.toLocaleUpperCase('tr-TR');
        const list = document.getElementById('modal-list-body'); list.innerHTML = "";
        
        // Önce Asistanlar
        Object.values(aracMap).forEach(a => {
            if(a.kod !== uFullKey && (a.ad.includes(ara) || a.kod.includes(ara))) {
                const d = document.createElement('div'); d.className = "sube-item"; d.innerHTML = "🚛 " + a.kod;
                d.onclick = () => { document.getElementById('target-sube').value = a.kod; closeModal(); };
                list.appendChild(d);
            }
        });
        // Sonra Şubeler
        [...staticSubeler, ...dynamicSubeler].filter(s => s.includes(ara)).forEach(s => {
            const d = document.createElement('div'); d.className = "sube-item"; d.innerText = "🏢 " + s;
            d.onclick = () => { document.getElementById('target-sube').value = s; closeModal(); };
            list.appendChild(d);
        });
    }

    function startTransfer(u, b) {
        tempTransferItem = { urun: u, barkod: b };
        document.getElementById('transfer-info').innerText = u + " (" + b + ") Gönderiliyor...";
        document.getElementById('transfer-modal').style.display = 'block';
        const bdy = document.getElementById('transfer-list-body'); bdy.innerHTML = "";
        
        Object.values(aracMap).forEach(a => {
            if(a.kod !== uFullKey) {
                const d = document.createElement('div'); d.className = "sube-item"; d.innerHTML = "🚛 " + a.kod;
                d.onclick = () => {
                    db.ref('transferler/canli_akis').push({
                        gonderen: uName, gonderen_kod: uFullKey, yer: a.kod,
                        urun: u, barkod: b, tip: "ÇIKIŞ", status: "ONAY BEKLIYOR", kp: ""
                    });
                    document.getElementById('transfer-modal').style.display = 'none';
                };
                bdy.appendChild(d);
            }
        });
    }

    function toggleTruckMode() {
        const isT = document.getElementById('to-my-truck').checked;
        document.getElementById('target-sube').value = isT ? uFullKey : "";
    }

    function tabEx(id, el) {
        document.querySelectorAll('.app-page').forEach(p => p.style.display = 'none');
        document.getElementById('p-'+id).style.display = 'block';
        document.querySelectorAll('.excel-nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
    }
</script>
</body>
