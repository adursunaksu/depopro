    function addLongPressListener(element, onClick, onLongPress) {
        let pressTimer;
        let isLongPress = false;
        let startX = 0; let startY = 0;

        const start = (e) => {
            if (e.type === 'touchstart' && e.touches.length > 1) return;
            isLongPress = false;
            if (e.type === 'touchstart') {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }
            pressTimer = setTimeout(() => {
                isLongPress = true;
                if (onLongPress) onLongPress(e);
            }, 600); 
        };

        const cancel = (e) => {
            if (pressTimer) clearTimeout(pressTimer);
            if (e.type === 'touchmove') {
                if (Math.abs(e.touches[0].clientX - startX) > 15 || Math.abs(e.touches[0].clientY - startY) > 15) {
                    clearTimeout(pressTimer);
                }
            }
        };

        element.addEventListener('touchstart', start, {passive: true});
        element.addEventListener('touchend', cancel, {passive: true});
        element.addEventListener('touchmove', cancel, {passive: true});
        element.addEventListener('touchcancel', cancel, {passive: true});
        
        element.addEventListener('mousedown', start);
        element.addEventListener('mouseup', cancel);
        element.addEventListener('mouseleave', cancel);

        element.onclick = (e) => {
            if (isLongPress) { e.preventDefault(); e.stopPropagation(); return; }
            if (onClick) onClick(e);
        };
    }

    function getProcessedList(staticArray, dynamicArray, category) {
        let processed = new Map();

        staticArray.forEach(s => processed.set(s.toLocaleUpperCase('tr-TR'), { ad: s, isStatic: true, originalName: s }));

        const ops = uiIslemler.filter(op => op.kategori === category);
        ops.forEach(op => {
            if (op.tip === 'sil') {
                let targetKey = null;
                for (let [k, v] of processed.entries()) {
                    if (v.originalName === op.isim) { targetKey = k; break; }
                }
                if (targetKey) processed.delete(targetKey);
            } else if (op.tip === 'duzenle') {
                let targetKey = null; let targetItem = null;
                for (let [k, v] of processed.entries()) {
                    if (v.originalName === op.eski) { targetKey = k; targetItem = v; break; }
                }
                if (targetItem) {
                    processed.delete(targetKey);
                    targetItem.ad = op.yeni;
                    processed.set(op.yeni.toLocaleUpperCase('tr-TR'), targetItem);
                }
            }
        });

        dynamicArray.forEach(d => {
            processed.set(d.ad.toLocaleUpperCase('tr-TR'), { ad: d.ad, key: d.key, isStatic: false });
        });

        return Array.from(processed.values());
    }

    function processOfflineQueue() {
        if(!navigator.onLine) return; 
        
        let offlineList = JSON.parse(localStorage.getItem('s016_offline_q') || '[]');
        if(offlineList.length === 0) return;

        let pending = [];
        let promises = offlineList.map(item => {
            return db.ref(item.path).push(item.data).catch(() => {
                pending.push(item); 
            });
        });

        Promise.all(promises).then(() => {
            localStorage.setItem('s016_offline_q', JSON.stringify(pending));
            if (pending.length < offlineList.length) {
                loadDataREST(); 
            }
        });
    }

    window.addEventListener('online', processOfflineQueue);

    async function loadDataREST() {
        // İvanti kalkanını tamamen aşmak için Ayarlar (Şube, Ürün) da dahil her şeyi HTTPS üzerinden çekeriz
        if (!firebase.auth().currentUser) return;
        try {
            const token = await firebase.auth().currentUser.getIdToken();
            const baseUrl = "https://depotakippro-default-rtdb.europe-west1.firebasedatabase.app";
            
            // 1. Akış Verilerini Çek
            const resAkis = await fetch(`${baseUrl}/transferler/canli_akis.json?auth=${token}`);
            const akisData = await resAkis.json();
            renderAkis(akisData);

            // 2. Depo Verilerini Çek
            const resDepo = await fetch(`${baseUrl}/depolar.json?auth=${token}`);
            const depoData = await resDepo.json();
            renderDepo(depoData);

            // 3. Ayarlar Verilerini Çek (Şubeler, Ürünler, UI İşlemleri - PC İÇİN KRİTİK GÜNCELLEME)
            const resAyarlar = await fetch(`${baseUrl}/ayarlar.json?auth=${token}`);
            const ayarlarData = await resAyarlar.json();
            
            if (ayarlarData) {
                // UI İşlemleri (Silme ve Düzenlemeler)
                uiIslemler = [];
                if (ayarlarData.ui_islemler) {
                    Object.keys(ayarlarData.ui_islemler).forEach(k => {
                        uiIslemler.push({...ayarlarData.ui_islemler[k], key: k});
                    });
                }

                // Dinamik Ürün Listesi
                dynamicEnvanterler = [];
                if (ayarlarData.urun_listesi) {
                    Object.keys(ayarlarData.urun_listesi).forEach(k => {
                        let val = ayarlarData.urun_listesi[k];
                        let ad = typeof val === 'string' ? val : val.ad;
                        if (ad) dynamicEnvanterler.push({key: k, ad: ad});
                    });
                }

                // Dinamik Şube Listesi
                dynamicSubeler = [];
                if (ayarlarData.sube_listesi) {
                    Object.keys(ayarlarData.sube_listesi).forEach(k => {
                        let val = ayarlarData.sube_listesi[k];
                        let ad = typeof val === 'string' ? val : val.ad;
                        if (ad) dynamicSubeler.push({key: k, ad: ad});
                    });
                }

                // Ekrana Yansıt
                updateAllSelects();
                updateSubeCounter();
                if(document.getElementById('sube-modal').style.display === 'block') filterSubeler(); 
                if(document.getElementById('envanter-modal').style.display === 'block') renderEnvanterList();
            }

        } catch (e) {
            console.error("Bilgisayar ortamı veri çekme hatası (Ivanti kısıtlaması olabilir):", e);
        }
    }

    function startScannerEx(targetInputId) {
        document.getElementById('camera-modal').style.display = 'flex';
        try {
            html5QrcodeScannerEx = new Html5Qrcode("reader");
            html5QrcodeScannerEx.start(
                { facingMode: "environment" },
                { fps: 20, qrbox: { width: 300, height: 100 }, experimentalFeatures: { useBarCodeDetectorIfSupported: true } },
                (decodedText) => {
                    const input = document.getElementById(targetInputId);
                    if(input) {
                        input.value = decodedText;
                        if(targetInputId.startsWith('kp-')) {
                            const dbKey = targetInputId.replace('kp-', '');
                            db.ref('transferler/canli_akis/' + dbKey).update({kp: decodedText}).then(loadDataREST);
                        }
                    }
                    stopScannerEx();
                }
            ).catch(err => { 
                console.error("Kamera açılamadı:", err);
                alert("Kamera başlatılamadı! Lütfen tarayıcı izinlerinizi kontrol edin.");
                stopScannerEx(); 
            });
        } catch (e) {
            alert("Barkod okuyucu yüklenirken bir hata oluştu.");
            stopScannerEx();
        }
    }

    function stopScannerEx() {
        if(html5QrcodeScannerEx) {
            html5QrcodeScannerEx.stop().then(() => {
                html5QrcodeScannerEx = null;
                document.getElementById('camera-modal').style.display = 'none';
            }).catch(() => {
                html5QrcodeScannerEx = null;
                document.getElementById('camera-modal').style.display = 'none';
            });
        } else {
            document.getElementById('camera-modal').style.display = 'none';
        }
    }

    function formatKP(text) {
        if(!text) return "";
        let parts = text.split(' ');
        if(/^\d+$/.test(parts[0])) {
            return parts.slice(1).join(' ').replace(/-İzmir Şubesi/gi, '').replace(/-Manisa Şubesi/gi, '').replace(/Şubesi/gi, '').trim();
        }
        return text; 
    }

    function login() {
        const e = document.getElementById('email').value.trim().toLowerCase();
        const p = document.getElementById('pass').value;
        const isRem = document.getElementById('rem-check').checked;

        const persistence = isRem ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION;

        firebase.auth().setPersistence(persistence).then(() => {
            return firebase.auth().signInWithEmailAndPassword(e, p);
        }).then(() => {
            if(isRem) {
                localStorage.setItem('s016_mail', e);
                localStorage.setItem('s016_pass', p);
            } else {
                localStorage.removeItem('s016_mail');
                localStorage.removeItem('s016_pass');
            }
        }).catch(() => alert("Giriş Hatalı!"));
    }

    function logout() {
        if(confirm("Oturumu kapatmak istediğinize emin misiniz?")) {
            firebase.auth().signOut().then(() => location.reload());
        }
    }

    function cleanDatabase() {
        db.ref('ayarlar/sube_listesi').once('value', snap => {
            let seenNames = new Set();
            staticSubeler.forEach(s => seenNames.add(s.toLocaleUpperCase('tr-TR').trim()));
            snap.forEach(child => {
                let val = child.val();
                let ad = typeof val === 'string' ? val : val.ad;
                if(ad && seenNames.has(ad.trim().toLocaleUpperCase('tr-TR'))) { child.ref.remove(); }
            });
        });

        db.ref('ayarlar/urun_listesi').once('value', snap => {
            let seenProducts = new Set();
            staticProductsList.forEach(s => seenProducts.add(s.toLocaleUpperCase('tr-TR').trim()));
            snap.forEach(child => {
                let val = child.val();
                let ad = typeof val === 'string' ? val : val.ad;
                if(ad && seenProducts.has(ad.trim().toLocaleUpperCase('tr-TR'))) { child.ref.remove(); }
            });
        });
    }

    function openDepoItemMenu(depoKey, itemKey, urun, barkod) {
        const title = urun + " (" + barkod + ")";
        const data = { depoKey: depoKey, itemKey: itemKey, urun: urun, barkod: barkod };
        openAS(title, 'depo_item', data);
    }

    function globalDepoyaEkle() {
        const depoAd = prompt("Hangi Araç Deposuna ürün eklenecek?\n(Kendi deponuz için varsayılanı bırakabilirsiniz)", uFullKey);
        if(depoAd && depoAd.trim() !== "") {
            depoyaManuelEkle(depoAd.trim());
        }
    }

    function depoyaManuelEkle(depoKey) {
        const urun = prompt("📦 " + depoKey + " deposu için eklenecek ÜRÜN İSMİ:");
        if (urun && urun.trim() !== "") {
            openNumericPrompt(urun.trim() + " için BARKOD NUMARASI:", "", function(barkod) {
                db.ref('depolar/' + depoKey).push({
                    urun: urun.trim(),
                    barkod: barkod
                }).then(loadDataREST);
            });
        }
    }

    function openAkisMenu(e, gKey) {
        e.stopPropagation();
        selectedAkisGKey = gKey;
        
        const groupData = currentAkisData[gKey];
        if(!groupData || groupData.length === 0) return;
        
        document.getElementById('btnDeleteGroup').style.display = 'flex'; 

        const menu = document.getElementById('akis-context-menu');
        menu.style.display = 'flex';
        menu.style.left = (e.pageX - 170) + 'px';
        menu.style.top = (e.pageY + 15) + 'px';
        
        if ("vibrate" in navigator) navigator.vibrate(50);
        setTimeout(() => { document.addEventListener('click', function closeMenu(ev) { if (!ev.target.closest('#akis-context-menu')) { menu.style.display = 'none'; document.removeEventListener('click', closeMenu); } }); }, 10);
    }

    async function copyToExcel() {
        document.getElementById('akis-context-menu').style.display = 'none';
        if(!selectedAkisGKey || !currentAkisData[selectedAkisGKey]) return;
        
        const groupData = currentAkisData[selectedAkisGKey];
        let excelRows = [];
        
        const today = new Date();
        const tarihStr = today.toLocaleDateString('tr-TR', {day: '2-digit', month: '2-digit', year: 'numeric'});
        
        groupData.forEach(item => {
            const d = item.d;
            if(d.tip === "GİRİŞ" || d.tip === "AL") {
                const urun = d.urun || "";
                const barkod = d.barkod || "";
                const kpNo = d.kp || "";
                
                const row = `${urun}\t${barkod}\t\t${kpNo}\t\t${tarihStr}\tAdaksu`;
                excelRows.push(row);
            }
        });

        if(excelRows.length === 0) {
            alert("Bu grupta kopyalanacak 'Arızalı' (Giriş) cihaz bulunamadı.");
            return;
        }

        const finalString = excelRows.join('\n');

        try { 
            await navigator.clipboard.writeText(finalString); 
            alert("✅ Arızalı cihaz verileri Excel formatında kopyalandı!\n\nŞimdi Excel'de B sütununa (MODEL hücresine) tıklayıp doğrudan 'Yapıştır' diyebilirsiniz."); 
        } 
        catch (err) { 
            alert("Kopyalama başarısız oldu. Tarayıcınız pano erişimine izin vermiyor olabilir."); 
        }
    }

    async function sendAkisMail() {
        document.getElementById('akis-context-menu').style.display = 'none';
        if(!selectedAkisGKey || !currentAkisData[selectedAkisGKey]) return;
        const groupData = currentAkisData[selectedAkisGKey];
        let takilanlar = []; let alinanlar = [];
        let persIsmi = groupData[0].d.personel || ""; if (persIsmi === "-") persIsmi = "";

        groupData.forEach(item => {
            if(item.d.tip === "ÇIKIŞ" || item.d.tip === "VER") takilanlar.push(item.d.barkod || item.d.urun);
            if(item.d.tip === "GİRİŞ" || item.d.tip === "AL") alinanlar.push(item.d.barkod || item.d.urun);
        });

        const bodyText = `Sayın Yetkili,\n\nArızalı olan cihazın değişimi gerçekleştirilmiş olup, envanter bilgileri aşağıda yer almaktadır.\n\nTakılan: ${takilanlar.join(', ')}\nArızalı : ${alinanlar.join(', ')}\n\nBilgilerinize,\nİyi çalışmalar.`;
        try { await navigator.clipboard.writeText(bodyText); alert("✅ İçerik panoya kopyalandı!\nE-posta uygulamanız açılıyor..."); } 
        catch (err) { alert("Metin panoya otomatik kopyalanamadı. Lütfen manuel olarak kopyalayın.\n\n" + bodyText); }

        const to = "btsahaoperasyonlariyonetimiyetkili@ziraatbank.com.tr";
        const subject = "Envanter Transferi S016 Hk.";
        let ccText = "btizmirsahabakim@ziraatbank.com.tr"; if (persIsmi !== "") ccText += ";" + persIsmi;
        window.location.href = "mailto:" + to + "?cc=" + encodeURIComponent(ccText) + "&subject=" + encodeURIComponent(subject);
    }

    function deleteAkisGroup() {
        document.getElementById('akis-context-menu').style.display = 'none';
        if(!selectedAkisGKey || !currentAkisData[selectedAkisGKey]) return;
        
        if(confirm("Bu gruba ait tüm işlemleri kalıcı olarak silmek istediğinize emin misiniz?")) {
            currentAkisData[selectedAkisGKey].forEach(item => { 
                db.ref('transferler/canli_akis/' + item.key).remove().then(loadDataREST); 
            });
        }
    }

    function addRowEx(type = "ÇIKIŞ") {
        const rowId = 'brk-' + Math.random().toString(36).substr(2, 9);
        const inputId = 'urun-' + rowId;
        const div = document.createElement('div'); div.className = "excel-row-container";
        
        const processedList = getProcessedList(staticProductsList, dynamicEnvanterler, 'urun');
        const defaultUrun = processedList.length > 0 ? processedList[0].ad : "";

        div.innerHTML = `
            <select class="type-select ${type==='ÇIKIŞ'?'bg-out':'bg-in'}" onchange="this.classList.toggle('bg-out', this.value==='ÇIKIŞ'); this.classList.toggle('bg-in', this.value==='GİRİŞ')">
                <option value="ÇIKIŞ" ${type==='ÇIKIŞ'?'selected':''}>Takılan</option>
                <option value="GİRİŞ" ${type==='GİRİŞ'?'selected':''}>Arızalı</option>
            </select>
            <div class="scan-container">
                <input type="number" id="${rowId}" placeholder="Barkod..." class="barkod-input">
                <span class="magnifier-btn" onclick="startScannerEx('${rowId}')">🔍</span>
            </div>
            <input type="text" id="${inputId}" class="urun-input" readonly value="${defaultUrun}" onclick="openEnvanterModal('${inputId}')" placeholder="Ürün">
        `;
        document.getElementById('items-container').appendChild(div);
    }

    let isAddingSube = false;
    function manualAdd() { 
        if(isAddingSube) return;
        const n = prompt("Yeni Şube/Lokasyon İsmi?"); 
        if(n && n.trim() !== "") {
            const trimmed = n.trim(); const upper = trimmed.toLocaleUpperCase('tr-TR');
            const processedList = getProcessedList(staticSubeler, dynamicSubeler, 'sube');
            
            if(processedList.some(s => s.ad.toLocaleUpperCase('tr-TR') === upper)) { alert("Bu şube/lokasyon zaten listede mevcut!"); return; }

            isAddingSube = true;
            db.ref('ayarlar/sube_listesi').push(trimmed).then(() => {
                document.getElementById('sube-ara').value = trimmed;
                isAddingSube = false;
                loadDataREST(); // PC için zorla yenile
            }).catch(() => { isAddingSube = false; });
        } 
    }
    
    function openModal() { document.getElementById('sube-modal').style.display = 'block'; filterSubeler(); }
    function closeModal() { document.getElementById('sube-modal').style.display = 'none'; }
    
    function openEnvanterModal(inputId) { 
        currentUrunInputId = inputId;
        document.getElementById('envanter-modal').style.display = 'block'; 
        renderEnvanterList(); 
    }
    
    function closeEnvanterModal() { document.getElementById('envanter-modal').style.display = 'none'; }

    let isAddingEnv = false;
    function manualEnvanterAdd() {
        if(isAddingEnv) return;
        const n = prompt("Yeni Envanter Çeşidi?");
        if(n && n.trim() !== "") {
            const trimmed = n.trim(); const upper = trimmed.toLocaleUpperCase('tr-TR');
            const processedList = getProcessedList(staticProductsList, dynamicEnvanterler, 'urun');
            
            if(processedList.some(s => s.ad.toLocaleUpperCase('tr-TR') === upper)) { alert("Bu envanter zaten listede mevcut!"); return; }

            isAddingEnv = true;
            db.ref('ayarlar/urun_listesi').push(trimmed).then(() => { 
                document.getElementById('env-ara').value = trimmed;
                isAddingEnv = false; 
                loadDataREST(); // PC için zorla yenile
            }).catch(() => { isAddingEnv = false; });
        }
    }

    function selectEnvanter(ad) {
        if(currentUrunInputId) { document.getElementById(currentUrunInputId).value = ad; }
        closeEnvanterModal();
    }

    function approveTransfer(key) {
        db.ref('transferler/canli_akis/' + key).once('value', s => {
            const d = s.val();
            db.ref('depolar/' + d.gonderen_kod).once('value', ds => { ds.forEach(item => { if(item.val().barkod === d.barkod) item.ref.remove(); }); });
            db.ref('depolar/' + uFullKey).push({ urun: d.urun, barkod: d.barkod });
            db.ref('transferler/canli_akis/' + key).update({status: "YAPILDI"}).then(loadDataREST);
        });
    }

    function updateAllSelects() {
        const processedList = getProcessedList(staticProductsList, dynamicEnvanterler, 'urun');
        const validNames = processedList.map(s => s.ad);
        const defaultUrun = validNames.length > 0 ? validNames[0] : "";

        document.querySelectorAll('.urun-input').forEach(inp => {
            if(inp.value && !validNames.includes(inp.value)) {
                inp.value = defaultUrun;
            }
        });
    }

    async function saveAllEx() {
        const target = document.getElementById('target-sube').value;
        const pers = document.getElementById('personel-name').value.trim();
        
        if(!target || target === "Hedef Lokasyon Seçin") return alert("Lütfen bir lokasyon seçin!");
        if(!pers) return alert("Lütfen Personel İsmi giriniz!");

        let addedCount = 0;
        const kpFormatted = formatKP(target);
        
        const now = new Date();
        const tarih = now.toLocaleDateString('tr-TR');
        const saat = now.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});

        const rowElements = Array.from(document.querySelectorAll('.excel-row-container')).reverse();

        // 1. Çevrimdışı Belleği Al
        let offlineList = JSON.parse(localStorage.getItem('s016_offline_q') || '[]');

        rowElements.forEach(row => {
            const b = String(row.querySelector('.barkod-input').value).trim();
            const u = row.querySelector('.urun-input').value;
            const type = row.querySelector('.type-select').value;
            
            if(b) {
                const kpVal = (type === "ÇIKIŞ") ? kpFormatted : "";
                const data = { 
                    gonderen: uName, yer: target, personel: pers, tip: type, 
                    barkod: b, urun: u, status: "BEKLEMEDE", kp: kpVal, 
                    tarih: tarih, saat: saat, gonderen_kod: uFullKey 
                };
                
                // 2. Buluta değil, önce kendi hafızana yaz
                offlineList.push({ path: 'transferler/canli_akis', data: data });
                addedCount++;
            }
        });

        // 3. Hafızayı güncelle
        localStorage.setItem('s016_offline_q', JSON.stringify(offlineList));

        if (addedCount > 0) { 
            document.getElementById('items-container').innerHTML = ""; 
            document.getElementById('personel-name').value = "";
            addRowEx("ÇIKIŞ"); addRowEx("GİRİŞ"); 
        }
        
        alert(addedCount > 0 ? "Kayıtlar hafızaya alındı, senkronize ediliyor..." : "Kaydedilecek veri yok.");
        
        // 4. Müsaitse hemen buluta pompalamayı dene
        processOfflineQueue();
    }

    function filterSubeler() {
        const ara = document.getElementById('sube-ara').value.toLocaleUpperCase('tr-TR');
        const list = document.getElementById('modal-list-body'); list.innerHTML = "";
        
        const processedList = getProcessedList(staticSubeler, dynamicSubeler, 'sube');
        
        processedList.filter(s => s.ad.toLocaleUpperCase('tr-TR').includes(ara)).forEach(s => {
            const d = document.createElement('div'); d.className = "sube-item"; 
            
            d.innerHTML = `
                <div style="display:flex; width:100%; align-items:center;">
                    <span style="font-size:16px; margin-right:10px;">🏢</span>
                    <span style="flex:1; font-weight:bold; color:#444;">${s.ad}</span>
                    <span style="color:#999; font-size:10px; background:#f5f5f5; padding:4px 8px; border-radius:12px; white-space:nowrap;">⏳ Basılı Tut</span>
                </div>`; 
                
            addLongPressListener(d, 
                () => { document.getElementById('target-sube').value = s.ad; closeModal(); }, 
                () => { openAS(s.ad, 'sube', s); }
            );
            list.appendChild(d);
        });
    }

    function renderEnvanterList() {
        const ara = document.getElementById('env-ara').value.toLocaleUpperCase('tr-TR');
        const list = document.getElementById('envanter-list-body'); list.innerHTML = "";
        
        const processedList = getProcessedList(staticProductsList, dynamicEnvanterler, 'urun');
        
        processedList.filter(s => s.ad.toLocaleUpperCase('tr-TR').includes(ara)).forEach(s => {
            const d = document.createElement('div'); d.className = "sube-item"; 
            
            d.innerHTML = `
                <div style="display:flex; width:100%; align-items:center;">
                    <span style="font-size:16px; margin-right:10px;">📦</span>
                    <span style="flex:1; font-weight:bold; color:#444;">${s.ad}</span>
                    <span style="color:#999; font-size:10px; background:#f5f5f5; padding:4px 8px; border-radius:12px; white-space:nowrap;">⏳ Basılı Tut</span>
                </div>`; 
                
            addLongPressListener(d, 
                () => { selectEnvanter(s.ad); }, 
                () => { openAS(s.ad, 'urun', s); }
            );
            list.appendChild(d);
        });
    }
    
    function updateSubeCounter() { 
        const processedList = getProcessedList(staticSubeler, dynamicSubeler, 'sube');
        document.getElementById('target-sube').placeholder = `📍 Hedef Lokasyon Seçin (${processedList.length})`; 
    }
    
    function tabEx(id, el) { document.querySelectorAll('.app-page').forEach(p => p.style.display = 'none'); document.getElementById('p-'+id).style.display = 'block'; document.querySelectorAll('.excel-nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }

    function filterAkis() {
        const ara = document.getElementById('akis-ara').value.toLocaleUpperCase('tr-TR');
        const wrappers = document.querySelectorAll('#akis-container > div');

        wrappers.forEach(wrapper => {
            const locationHeader = wrapper.querySelector('div').innerText.toLocaleUpperCase('tr-TR');
            const rows = wrapper.querySelectorAll('tbody tr');
            let hasVisibleRow = false;

            const locationMatch = locationHeader.includes(ara);

            rows.forEach(row => {
                const rowText = row.innerText.toLocaleUpperCase('tr-TR');
                if (locationMatch || rowText.includes(ara)) {
                    row.style.display = '';
                    hasVisibleRow = true;
                } else {
                    row.style.display = 'none';
                }
            });

            if (hasVisibleRow || locationMatch) {
                wrapper.style.display = '';
            } else {
                wrapper.style.display = 'none';
            }
        });
    }
