    let dynamicSubeler = [];

    const aracMap = {
        "adaksu@ziraatbank.com.tr": { ad: "AHMET", kod: "s542 Ahmet" },
        "dokocadag@ziraatbank.com.tr": { ad: "DOĞAÇ", kod: "s573 Doğaç" },
        "taylansahin@ziraatbank.com.tr": { ad: "TAYLAN", kod: "s574 Taylan" },
        "adincel@ziraatbank.com.tr": { ad: "ALİ RIZA", kod: "s569 Ali Rıza" },

    };

    // --- DOĞRU INTENT ÇAĞRISI VE GİRİŞ KONTROLÜ ---
    window.onload = function() {
        const mail = localStorage.getItem('s016_mail');
        const pass = localStorage.getItem('s016_pass');
        if (mail && pass) {
            document.getElementById('email').value = mail;
            document.getElementById('pass').value = pass;
            login(true);
        }
    };

    function login(isAuto = false) {
        const e = document.getElementById('email').value.trim().toLowerCase();
        const p = document.getElementById('pass').value;
        firebase.auth().signInWithEmailAndPassword(e, p).then(u => {
            localStorage.setItem('s016_mail', e); localStorage.setItem('s016_pass', p);
            uMail = e; uName = (aracMap[e] || {ad: e.split('@')[0].toUpperCase()}).ad;
            uFullKey = (aracMap[e] || {kod: e.split('@')[0]}).kod;
            document.getElementById('userTag').innerHTML = `${uName} <span class="logout-btn" onclick="logout()">ÇIKIŞ</span>`;
            document.getElementById('login-screen').style.display = 'none';
            init();
            
            const params = new URLSearchParams(window.location.search);
            const barcode = params.get('barcode');
            if(barcode) processBarcode(barcode, params.get('target'));
        }).catch(() => { if(!isAuto) alert("Giriş Hatalı!"); });
    }

    function processBarcode(code, target) {
        if(target && target.startsWith('kp-')) {
            db.ref('transferler/canli_akis/' + target.replace('kp-', '')).update({kp: code});
            tabEx('akis', document.querySelectorAll('.excel-nav-item')[1]);
        } else {
            const inputs = document.querySelectorAll('.barkod-input');
            let found = false;
            for(let i=0; i<inputs.length; i++) {
                if(inputs[i].value === "") { inputs[i].value = code; found = true; break; }
            }
            if(!found) { 
                addRowEx("ÇIKIŞ"); 
                setTimeout(() => {
                    const ni = document.querySelectorAll('.barkod-input'); 
                    ni[ni.length-1].value = code;
                }, 100); 
            }
        }
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    function startScannerEx(targetId) {
        // İŞTE SİHİRLİ DOKUNUŞ BURADA:
        // ret= parametresi ile "tarama bitince nereye döneceğini" söylüyoruz.
        // {CODE} kısmını Binary Eye okuduğu değerle otomatik değiştirecektir.
        const returnUrl = window.location.origin + window.location.pathname + "?target=" + targetId + "&barcode={CODE}";
        const intentUrl = "intent://scan/?ret=" + encodeURIComponent(returnUrl) + "#Intent;scheme=zxing;package=com.google.zxing.client.android;end";
        window.location.href = intentUrl;
    }

    function formatKP(text) {
        if(!text) return "";
        let parts = text.split(' ');
        if(/^\d+$/.test(parts[0])) {
            return parts.slice(1).join(' ').replace(/-İzmir Şubesi/gi, '').replace(/-Manisa Şubesi/gi, '').replace(/Şubesi/gi, '').trim();
        }
        return text; 
    }

    function init() {
        db.ref('ayarlar/urun_listesi').on('value', snap => { updateAllSelects(); });
        db.ref('ayarlar/sube_listesi').on('value', snap => {
            let list = []; snap.forEach(i => list.push(i.val()));
            dynamicSubeler = list; updateSubeCounter();
        });

        db.ref('transferler/canli_akis').on('value', snap => {
            const container = document.getElementById('akis-container');
            if(!container) return;
            const groupedData = {}; const groupOrder = [];
            snap.forEach(i => {
                const d = i.val(); const key = i.key; const groupKey = d.yer + "|||" + (d.saat || "Belirtilmemiş");
                if(!groupedData[groupKey]) groupedData[groupKey] = [];
                groupedData[groupKey].unshift({ key, d });
                const idx = groupOrder.indexOf(groupKey);
                if(idx > -1) groupOrder.splice(idx, 1);
                groupOrder.unshift(groupKey);
            });

            let fullHtml = "";
            groupOrder.forEach(gKey => {
                const parts = gKey.split("|||"); const yer = parts[0]; const saat = parts[1];
                let rowsHtml = "";
                groupedData[gKey].forEach(item => {
                    const key = item.key; const d = item.d;
                    const isD = d.status === "YAPILDI"; const isOnay = d.status === "ONAY BEKLIYOR";
                    const isReceiver = d.yer === uFullKey;
                    const isPassiveKP = (d.tip === "ÇIKIŞ" || d.tip === "VER");

                    let actionHtml = "";
                    if(isOnay) {
                        actionHtml = isReceiver ? `<button class="btn-status bg-onay" onclick="approveTransfer('${key}')">KABUL ET</button>` : `<span style="color:orange; font-weight:bold;">ONAYDA</span>`;
                    } else {
                        actionHtml = `<button class="btn-status ${isD?'bg-done':'bg-waiting'}" onclick="db.ref('transferler/canli_akis/${key}').update({status:('${d.status}'==='BEKLEMEDE'?'YAPILDI':'BEKLEMEDE')})">${isD?'YAPILDI':'BEKLİYOR'}</button>`;
                    }

                    let kpCell = "";
                    if(isPassiveKP) {
                        kpCell = `<input type="text" class="kp-input-large" readonly style="background:#eee; border:none; color:#666;" value="${d.kp||''}">`;
                    } else {
                        kpCell = `
                            <div style="position:relative; display:flex; align-items:center;">
                                <input type="text" id="kp-${key}" class="kp-input-large" onblur="db.ref('transferler/canli_akis/${key}').update({kp:this.value})" value="${d.kp||''}">
                                <span style="position:absolute; right:5px; cursor:pointer; font-size:18px;" onclick="startScannerEx('kp-${key}')">🔍</span>
                            </div>`;
                    }

                    rowsHtml += `
                    <tr class="${isD?'row-done':(isOnay?'row-onay':'row-waiting')}">
                        <td style="width:30%;"><b>${d.urun}</b><br><small>${d.barkod}${isD?'✅':''}</small></td>
                        <td style="width:20%;">${d.gonderen}</td>
                        <td style="width:25%;">${kpCell}</td>
                        <td style="width:25%;">${actionHtml}</td>
                    </tr>`;
                });

                fullHtml += `
                <div style="margin-bottom:15px; border:1px solid var(--excell-green); border-radius:4px; overflow:hidden; background:#fff;">
                    <div style="background:var(--excell-green); color:white; padding:8px 10px; font-weight:bold; font-size:12px; display:flex; justify-content:space-between;">
                        <span>🏢 ${yer}</span><span style="font-size:10px; opacity:0.8;">${saat}</span>
                    </div>
                    <table class="excel-table" style="border:none;">
                        <thead><tr><th>Ürün-Barkod</th><th>Asistan</th><th>KP NO</th><th>Transfer</th></tr></thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </div>`;
            });
            container.innerHTML = fullHtml;
        });

        db.ref('depolar').on('value', snap => {
            const c = document.getElementById('depoExList'); c.innerHTML = "";
            snap.forEach(d => {
                const isMyDepo = d.key === uFullKey;
                let rws = ""; 
                d.forEach(r => { const v = r.val(); rws += `<tr class="${isMyDepo?'depo-row':''}"><td>${v.urun}</td><td>${v.barkod}</td></tr>`; });
                c.innerHTML += `<div style="margin-bottom:10px; border:1px solid #ccc;"><div style="background:#217346; color:white; padding:8px; font-weight:bold;">📦 ${d.key} Arac Depo</div><table class="excel-table">${rws}</table></div>`;
            });
        });
        updateSubeCounter();
    }

    function addRowEx(type = "ÇIKIŞ") {
        const rowId = 'brk-' + Math.random().toString(36).substr(2, 5);
        const div = document.createElement('div'); div.className = "excel-row-container";
        div.innerHTML = `
            <select class="type-select ${type==='ÇIKIŞ'?'bg-out':'bg-in'}" onchange="this.classList.toggle('bg-out', this.value==='ÇIKIŞ'); this.classList.toggle('bg-in', this.value==='GİRİŞ')">
                <option value="ÇIKIŞ" ${type==='ÇIKIŞ'?'selected':''}>VER</option>
                <option value="GİRİŞ" ${type==='GİRİŞ'?'selected':''}>AL</option>
            </select>
            <div class="scan-container">
                <input type="number" id="${rowId}" placeholder="Barkod..." class="barkod-input">
                <span class="magnifier-btn" onclick="startScannerEx('${rowId}')">🔍</span>
            </div>
            <select class="urun-select" onchange="checkNewUrun(this)"></select>`;
        document.getElementById('items-container').appendChild(div);
        updateAllSelects();
    }

    function updateAllSelects() {
        db.ref('ayarlar/urun_listesi').once('value', snap => {
            let list = ["Cüzdan yazıcı","Pc","Tarayıcı","Monitör","Ip telefon","Switch","Router","Sunucu","Nvr","Laptop","Lazer yazıcı","Kamera"];
            snap.forEach(i => { if(!list.includes(i.val())) list.push(i.val()); });
            document.querySelectorAll('.urun-select').forEach(sel => {
                const old = sel.value;
                sel.innerHTML = list.map(u => `<option value="${u}">${u}</option>`).join('') + `<option value="ADD_NEW" style="color:#217346; font-weight:bold;">➕ YENİ EKLE</option>`;
                if(old && list.includes(old)) sel.value = old;
            });
        });
    }

    async function saveAllEx() {
        const target = document.getElementById('target-sube').value;
        const toMyTruck = document.getElementById('to-my-truck').checked;
        if(!toMyTruck && (!target || target === "Hedef Lokasyon Seçin")) return alert("Lütfen bir lokasyon seçin!");

        let addedCount = 0;
        const kpFormatted = formatKP(target);
        const rowElements = Array.from(document.querySelectorAll('.excel-row-container')).reverse();

        rowElements.forEach(row => {
            const b = String(row.querySelector('.barkod-input').value).trim();
            const u = row.querySelector('.urun-select').value;
            const type = row.querySelector('.type-select').value;
            if(b) {
                if(toMyTruck) { 
                    db.ref('depolar/' + uFullKey).push({ urun: u, barkod: b }); 
                } else {
                    db.ref('transferler/canli_akis').push({ 
                        gonderen: uName, yer: target, tip: type, barkod: b, urun: u, status: "BEKLEMEDE", 
                        kp: (type === "ÇIKIŞ" ? kpFormatted : ""), saat: new Date().toLocaleTimeString('tr-TR'), gonderen_kod: uFullKey 
                    });
                }
                addedCount++;
            }
        });
        if (addedCount > 0) { document.getElementById('items-container').innerHTML = ""; addRowEx("ÇIKIŞ"); addRowEx("GİRİŞ"); alert("Kaydedildi."); }
    }

    function openModal() { document.getElementById('sube-modal').style.display='block'; filterSubeler(); }
    function closeModal() { document.getElementById('sube-modal').style.display='none'; }
    function filterSubeler() {
        const ara = document.getElementById('sube-ara').value.toLocaleUpperCase('tr-TR');
        const list = document.getElementById('modal-list-body'); list.innerHTML = "";
        [...staticSubeler, ...dynamicSubeler].filter(s => s.toLocaleUpperCase('tr-TR').includes(ara)).forEach(s => {
            const d = document.createElement('div'); d.className = "sube-item"; d.innerText = s;
            d.onclick = () => { document.getElementById('target-sube').value = s; closeModal(); };
            list.appendChild(d);
        });
    }
    
    function filterAkis() {
        const ara = document.getElementById('akis-ara').value.toLocaleUpperCase('tr-TR');
        document.querySelectorAll('#akis-container > div').forEach(wrapper => {
            const head = wrapper.querySelector('div').innerText.toLocaleUpperCase('tr-TR');
            let hasVisibleRow = false;
            wrapper.querySelectorAll('tbody tr').forEach(row => {
                if (head.includes(ara) || row.innerText.toLocaleUpperCase('tr-TR').includes(ara)) {
                    row.style.display = ''; hasVisibleRow = true;
                } else { row.style.display = 'none'; }
            });
            wrapper.style.display = (hasVisibleRow || head.includes(ara)) ? '' : 'none';
        });
    }

    function checkNewUrun(sel) { if(sel.value === "ADD_NEW") { const n = prompt("Yeni Envanter?"); if(n) { db.ref('ayarlar/urun_listesi').push(n); setTimeout(() => sel.value = n, 500); } else sel.selectedIndex = 0; } }
    function toggleTruckMode() { const isT = document.getElementById('to-my-truck').checked; document.getElementById('target-sube').value = isT ? uFullKey : ""; }
    function updateSubeCounter() { document.getElementById('target-sube').placeholder = `Hedef Lokasyon (${staticSubeler.length + dynamicSubeler.length})`; }
    function tabEx(id, el) { document.querySelectorAll('.app-page').forEach(p => p.style.display='none'); document.getElementById('p-'+id).style.display='block'; document.querySelectorAll('.excel-nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
    function logout() { localStorage.clear(); location.reload(); }
    function approveTransfer(key) { db.ref('transferler/canli_akis/' + key).once('value', s => { const d = s.val(); db.ref('depolar/' + d.gonderen_kod).once('value', ds => { ds.forEach(item => { if(item.val().barkod === d.barkod) item.ref.remove(); }); }); db.ref('depolar/' + uFullKey).push({ urun: d.urun, barkod: d.barkod }); db.ref('transferler/canli_akis/' + key).update({status: "YAPILDI"}); }); }
</script>
</body>
</html>
