<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FINART Depo Takip v73.2</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        :root { --excell-green: #217346; --border: #d4d4d4; --bg: #f3f3f3; --red: #d32f2f; }
        .bg-in { background-color: #f8dbdb !important; color: #d83b01 !important; font-weight: bold; } 
        .bg-out { background-color: #d9e9f3 !important; color: #0078d4 !important; font-weight: bold; } 
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; font-size: 11px; }
        body { margin: 0; background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .excel-bar { background: var(--excell-green); color: white; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; }
        .user-cell { background: #fff; color: #333; padding: 4px 10px; border-radius: 4px; font-weight: bold; border: 1px solid #999; }
        .logout-btn { background: var(--red); color: white; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        .content { flex: 1; overflow-y: auto; padding: 5px; padding-bottom: 95px; }
        .excel-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; margin-bottom: 20px; }
        .excel-table th, .excel-table td { border: 1px solid var(--border); padding: 8px 4px; text-align: left; overflow: hidden; }
        .excel-table th { background: #ebf1de; position: sticky; top: 0; z-index: 10; font-size: 10px; }
        
        .row-waiting { background-color: #f8d7da !important; }
        .row-onay { background-color: #fff3cd !important; }
        .row-done { background-color: #d4edda !important; text-decoration: line-through; color: #666; }
        .btn-status { width: 100%; padding: 8px 2px; border: none; border-radius: 3px; font-weight: bold; color: white; font-size: 10px; }
        .bg-waiting { background: #dc3545; }
        .bg-onay { background: #ff9800; }
        .bg-done { background: #28a745; }

        .scan-container { position: relative; display: flex; align-items: center; flex: 2; height: 44px; }
        .barkod-input { width: 100%; height: 100%; border: none; border-right: 1px solid #ccc; padding: 0 30px 0 10px; font-size: 13px; outline: none; }
        .kp-wrapper { position: relative; display: flex; align-items: center; width: 100%; }
        .kp-input-large { width: 100%; border: 1px solid #ddd; padding: 4px 25px 4px 4px; border-radius: 2px; height: 26px; font-size: 10px; }
        .magnifier-btn { position: absolute; right: 5px; cursor: pointer; font-size: 14px; color: var(--excell-green); }

        .excel-row-container { display: flex; border: 1px solid #ccc; background: #fff; margin-bottom: 3px; min-height: 44px; align-items: center; border-radius: 4px; overflow: hidden; }
        .type-select { width: 60px; height: 44px; border: none; border-right: 1px solid #ccc; font-weight: bold; text-align: center; }
        .urun-select { flex: 2; height: 44px; border: none; padding-left: 5px; font-weight: bold; outline: none; }

        .excel-nav { height: 60px; background: #fff; border-top: 1px solid var(--border); display: flex; position: fixed; bottom: 0; width: 100%; z-index: 1000; }
        .excel-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; cursor: pointer; }
        .excel-nav-item.active { background: #f0f0f0; color: var(--excell-green); font-weight: bold; border-top: 3px solid var(--excell-green); }
        
        #login-screen { position: fixed; inset: 0; background: var(--excell-green); z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        #camera-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:4000; flex-direction:column; justify-content:center; }
        #reader { width:100%; max-width:400px; margin:auto; background:white; }
        #sube-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; padding:20px; }
        .modal-box { background:white; border-radius:8px; height:85vh; display:flex; flex-direction:column; overflow:hidden; }
        .modal-search { padding:10px; border-bottom:1px solid #eee; }
        .modal-search input { width:100%; padding:12px; border:2px solid var(--excell-green); border-radius:4px; }
        .modal-list { flex:1; overflow-y:auto; }
        .sube-item { padding:15px; border-bottom:1px solid #f0f0f0; font-size:13px; }
    </style>
</head>
<body>

<div id="login-screen">
    <h2 style="letter-spacing: 2px;">FINART DEPO</h2>
    <input type="email" id="email" placeholder="E-posta" style="width:80%; margin-bottom:10px; padding:12px; border-radius:4px; border:none;">
    <input type="password" id="pass" placeholder="Şifre" style="width:80%; margin-bottom:20px; padding:12px; border-radius:4px; border:none;">
    <button onclick="login()" style="width:80%; padding:15px; background:white; color:var(--excell-green); border:none; border-radius:4px; font-weight:bold;">GİRİŞ YAP</button>
</div>

<div id="sube-modal">
    <div class="modal-box">
        <div class="modal-search"><input type="text" id="sube-ara" placeholder="Şube ara..." oninput="filterSubeler()"></div>
        <div class="modal-list" id="modal-list-body"></div>
        <div style="padding:15px; background:#e8f5e9; text-align:center; font-weight:bold; cursor:pointer;" onclick="manualAdd()">➕ LİSTEDE OLMAYAN ŞUBE EKLE</div>
        <button onclick="closeModal()" style="padding:15px; background:#444; color:white; border:none;">VAZGEÇ</button>
    </div>
</div>

<div id="camera-modal">
    <button onclick="stopScannerEx()" style="width:40px; height:40px; background:white; border-radius:50%; color:red; position:absolute; top:20px; right:20px;">×</button>
    <div id="reader"></div>
</div>

<div class="excel-bar">
    <div style="font-weight:bold; font-size: 14px;">FINART</div>
    <div style="font-size: 10px; opacity: 0.7;">v73.2</div>
    <div class="user-area" style="display:flex; gap:5px; align-items:center;">
        <div class="user-cell" id="userTag">...</div>
        <button class="logout-btn" onclick="logout()">🚪</button>
    </div>
</div>

<div class="content">
    <div id="p-islem" class="app-page">
        <div style="background:#fff; padding:10px; border:1px solid #ccc; margin-bottom:5px; border-radius:4px;">
            <input type="text" id="target-sube" placeholder="Hedef Şube Seçin" readonly onclick="openModal()" style="width:100%; padding:12px; background:#fffde7; border:1px solid #ccc; font-weight:bold;">
            <label id="truck-label" style="display:none; align-items:center; gap:10px; margin-top:10px; color:var(--excell-green); font-weight:bold;">
                <input type="checkbox" id="to-my-truck" onchange="toggleTruckMode()"> 🚛 ARACIMA TRANSFER ET
            </label>
        </div>
        <div id="items-container"></div>
        <div class="excel-actions" style="display:flex; gap:5px; margin-top:10px;">
            <button class="btn-excel-add" onclick="addRowEx()" style="flex:1; padding:12px; border:1px solid #ccc; border-radius:4px;">➕ Satır Ekle</button>
            <button class="btn-excel-save" onclick="saveAllEx()" style="flex:1; padding:12px; background:var(--excell-green); color:white; border:none; border-radius:4px; font-weight:bold;">💾 KAYDET VE GÖNDER</button>
        </div>
    </div>

    <div id="p-akis" class="app-page" style="display:none;">
        <table class="excel-table" id="mainExTable">
            <thead>
                <tr>
                    <th style="width:22%;">Lokasyon</th>
                    <th style="width:20%;">Ürün-Barkod</th>
                    <th style="width:14%;">Asistan</th>
                    <th style="width:23%;">KP NO</th>
                    <th style="width:21%;">İŞLEM</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    
    <div id="p-depo" class="app-page" style="display:none;">
        <div id="depoExList"></div>
    </div>
</div>

<div class="excel-nav">
    <div id="nav-islem" class="excel-nav-item active" onclick="tabEx('islem', this)">📝 Form</div>
    <div class="excel-nav-item" onclick="tabEx('akis', this)">📊 Akış</div>
    <div class="excel-nav-item" onclick="tabEx('depo', this)">📦 Depolar</div>
</div>

    let dynamicSubeler = [];

    function login() {
        const e = document.getElementById('email').value.trim().toLowerCase();
        const p = document.getElementById('pass').value;
        firebase.auth().signInWithEmailAndPassword(e, p).then(u => {
            if(aracMap[e]) {
                uName = aracMap[e].ad; uFullKey = aracMap[e].kod; isAracli = true;
                document.getElementById('truck-label').style.display = 'flex';
                tabEx('islem', document.getElementById('nav-islem'));
            } else {
                uName = e.split('@')[0].toUpperCase(); uFullKey = uName; isAracli = false;
                document.getElementById('nav-islem').style.display = 'none';
                tabEx('akis', document.querySelectorAll('.excel-nav-item')[1]);
            }
            document.getElementById('userTag').innerText = uName;
            document.getElementById('login-screen').style.display = 'none';
            init();
        }).catch(() => alert("Giriş Hatası!"));
    }

    function init() {
        if(isAracli) { document.getElementById('items-container').innerHTML = ""; addRowEx("GİRİŞ"); addRowEx("ÇIKIŞ"); }
        db.ref('ayarlar/urun_listesi').on('value', snap => updateAllSelects());
        db.ref('ayarlar/sube_listesi').on('value', snap => {
            let list = []; snap.forEach(i => list.push(i.val()));
            dynamicSubeler = list; updateSubeCounter();
        });
        db.ref('transferler/canli_akis').on('value', snap => {
            const b = document.querySelector('#mainExTable tbody'); b.innerHTML = "";
            snap.forEach(i => {
                const d = i.val(); const key = i.key;
                const isD = d.status === "YAPILDI";
                const isReceiver = d.yer === uFullKey;
                let actionHtml = (isAracli && d.status === "ONAY BEKLIYOR" && isReceiver) ? 
                    `<button class="btn-status bg-onay" onclick="db.ref('transferler/canli_akis/${key}').update({status:'BEKLEMEDE'})">KABUL ET</button>` : 
                    `<button class="btn-status ${isD?'bg-done':'bg-waiting'}" ${isAracli?'':'disabled'} onclick="toggleStatus('${key}','${d.status}')">${isD?'TAMAM':'BEKLİYOR'}</button>`;
                
                b.innerHTML = `<tr class="${isD?'row-done':(d.status==='ONAY BEKLIYOR'?'row-onay':'row-waiting')}">
                    <td>${d.yer}</td><td><b>${d.urun}</b><br><small>${d.barkod}</small></td><td>${d.gonderen}</td>
                    <td><div class="kp-wrapper"><input type="text" id="kp-${key}" class="kp-input-large" value="${d.kp||''}" onblur="updateKp('${key}',this.value)" ${isAracli?'':'disabled'}><span class="magnifier-btn" onclick="${isAracli?`startScannerEx('kp-${key}')`:''}">🔍</span></div></td>
                    <td>${actionHtml}</td></tr>` + b.innerHTML;
            });
        });
        db.ref('depolar').on('value', snap => {
            const c = document.getElementById('depoExList'); c.innerHTML = "";
            snap.forEach(d => {
                let rws = ""; d.forEach(r => { rws += `<tr><td>${r.val().urun}</td><td>${r.val().barkod}</td></tr>`; });
                c.innerHTML += `<div style="margin-bottom:10px; border:1px solid #ccc;"><div style="background:var(--excell-green); color:white; padding:8px; font-weight:bold;">📦 ${d.key}</div><table class="excel-table">${rws}</table></div>`;
            });
        });
    }

    function addRowEx(type = "GİRİŞ") {
        const rowId = 'brk-' + Math.random().toString(36).substr(2, 5);
        const div = document.createElement('div'); div.className = "excel-row-container";
        div.innerHTML = `<select class="type-select ${type==='ÇIKIŞ'?'bg-out':'bg-in'}" onchange="this.className='type-select '+(this.value==='ÇIKIŞ'?'bg-out':'bg-in')">
            <option value="GİRİŞ" ${type==='GİRİŞ'?'selected':''}>AL</option><option value="ÇIKIŞ" ${type==='ÇIKIŞ'?'selected':''}>VER</option></select>
            <div class="scan-container"><input type="number" id="${rowId}" placeholder="Barkod..." class="barkod-input"><span class="magnifier-btn" onclick="startScannerEx('${rowId}')">🔍</span></div>
            <select class="urun-select" onchange="checkNewUrun(this)"></select>`;
        document.getElementById('items-container').appendChild(div);
        updateAllSelects();
    }

    function startScannerEx(tid) {
        document.getElementById('camera-modal').style.display = 'flex';
        html5QrcodeScannerEx = new Html5Qrcode("reader");
        html5QrcodeScannerEx.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (txt) => { 
            const inp = document.getElementById(tid); if(inp) inp.value = txt;
            if(tid.startsWith('kp-')) updateKp(tid.replace('kp-',''), txt);
            stopScannerEx(); 
        });
    }
    function stopScannerEx() { if(html5QrcodeScannerEx) html5QrcodeScannerEx.stop().then(() => document.getElementById('camera-modal').style.display='none'); }
    function filterSubeler() {
        const ara = document.getElementById('sube-ara').value.toLocaleUpperCase('tr-TR');
        const list = document.getElementById('modal-list-body'); list.innerHTML = "";
        [...staticSubeler, ...dynamicSubeler].filter(s => s.toLocaleUpperCase('tr-TR').includes(ara)).forEach(s => {
            const d = document.createElement('div'); d.className = "sube-item"; d.innerText = s; d.onclick = () => { document.getElementById('target-sube').value = s; closeModal(); }; list.appendChild(d);
        });
    }
    function updateAllSelects() {
        db.ref('ayarlar/urun_listesi').once('value', snap => {
            let list = ["Cüzdan yazıcı","Pc","Tarayıcı","Monitör","Ip telefon","Switch","Router","Sunucu","Laptop","Lazer yazıcı"];
            snap.forEach(i => { if(!list.includes(i.val())) list.push(i.val()); });
            document.querySelectorAll('.urun-select').forEach(sel => {
                const old = sel.value; sel.innerHTML = list.map(u => `<option value="${u}">${u}</option>`).join('') + `<option value="ADD_NEW (➕ EKLE)">ADD_NEW (➕ EKLE)</option>`;
                if(old) sel.value = old;
            });
        });
    }
    function checkNewUrun(sel) { if(sel.value.includes("ADD_NEW")) { const n = prompt("Yeni Ürün?"); if(n) db.ref('ayarlar/urun_listesi').push(n); } }
    function manualAdd() { const n = prompt("Yeni Şube?"); if(n) db.ref('ayarlar/sube_listesi').push(n); }
    function updateSubeCounter() { document.getElementById('target-sube').placeholder = `Hedef Seç (${staticSubeler.length + dynamicSubeler.length})`; }
    function toggleTruckMode() { if(document.getElementById('to-my-truck').checked) document.getElementById('target-sube').value = uFullKey; }
    function openModal() { document.getElementById('sube-modal').style.display='block'; filterSubeler(); }
    function closeModal() { document.getElementById('sube-modal').style.display='none'; }
    function tabEx(id, el) { 
        document.querySelectorAll('.app-page').forEach(p => p.style.display='none'); 
        document.getElementById('p-'+id).style.display='block'; 
        document.querySelectorAll('.excel-nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); 
    }
    function updateKp(key, val) { db.ref('transferler/canli_akis/'+key).update({kp: val}); }
    function toggleStatus(key, st) { db.ref('transferler/canli_akis/'+key).update({status: st==='BEKLEMEDE'?'YAPILDI':'BEKLEMEDE'}); }
    
    function saveAllEx() {
        const target = document.getElementById('target-sube').value;
        if(!target) return alert("Hedef seç!");
        document.querySelectorAll('.excel-row-container').forEach(row => {
            const b = row.querySelector('.barkod-input').value;
            const u = row.querySelector('.urun-select').value;
            const t = row.querySelector('.type-select').value;
            if(b) {
                if(document.getElementById('to-my-truck').checked) db.ref('depolar/'+uFullKey).push({urun:u, barkod:b});
                else db.ref('transferler/canli_akis').push({gonderen:uName, yer:target, tip:t, barkod:b, urun:u, status:"BEKLEMEDE", gonderen_kod:uFullKey});
            }
        });
        alert("Başarılı!"); location.reload();
    }
    function logout() { firebase.auth().signOut().then(() => location.reload()); }
    window.onload = () => document.getElementById('login-screen').style.display='flex';
</script>
</body>
</html>
