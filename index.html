<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FINART v73.3 Final</title>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.1/firebase-auth-compat.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        :root { --excell-green: #217346; --border: #d4d4d4; --bg: #f3f3f3; --red: #d32f2f; }
        .bg-in { background-color: #f8dbdb !important; color: #d83b01 !important; font-weight: bold; } 
        .bg-out { background-color: #d9e9f3 !important; color: #0078d4 !important; font-weight: bold; } 
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; font-size: 11px; }
        body { margin: 0; background: var(--bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .excel-bar { background: var(--excell-green); color: white; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center; }
        .user-cell { background: #fff; color: #333; padding: 4px 10px; border-radius: 4px; font-weight: bold; border: 1px solid #999; }
        .content { flex: 1; overflow-y: auto; padding: 5px; padding-bottom: 95px; }
        .excel-table { width: 100%; border-collapse: collapse; background: white; table-layout: fixed; margin-bottom: 20px; }
        .excel-table th, .excel-table td { border: 1px solid var(--border); padding: 8px 4px; text-align: left; }
        .row-waiting { background-color: #f8d7da !important; }
        .row-onay { background-color: #fff3cd !important; }
        .row-done { background-color: #d4edda !important; text-decoration: line-through; color: #666; }
        .btn-status { width: 100%; padding: 8px 2px; border: none; border-radius: 3px; font-weight: bold; color: white; cursor: pointer; }
        .kp-wrapper { position: relative; display: flex; align-items: center; }
        .kp-input-large { width: 100%; border: 1px solid #ddd; padding: 4px 20px 4px 4px; height: 26px; }
        .magnifier-btn { position: absolute; right: 5px; cursor: pointer; color: var(--excell-green); font-size: 14px; }
        .excel-row-container { display: flex; border: 1px solid #ccc; background: #fff; margin-bottom: 3px; min-height: 44px; align-items: center; border-radius: 4px; overflow: hidden; }
        .type-select { width: 60px; height: 44px; border: none; border-right: 1px solid #ccc; font-weight: bold; text-align: center; }
        .barkod-input { flex: 2; height: 44px; border: none; padding: 0 10px; outline: none; }
        .urun-select { flex: 2; height: 44px; border: none; padding-left: 5px; font-weight: bold; }
        .excel-nav { height: 60px; background: #fff; border-top: 1px solid var(--border); display: flex; position: fixed; bottom: 0; width: 100%; z-index: 1000; }
        .excel-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #666; }
        .excel-nav-item.active { background: #f0f0f0; color: var(--excell-green); border-top: 3px solid var(--excell-green); }
        #login-screen { position: fixed; inset: 0; background: var(--excell-green); z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div id="login-screen">
    <h2 style="color:white;">FINART DEPO</h2>
    <input type="email" id="email" placeholder="E-posta" style="width:80%; margin-bottom:10px; padding:12px;">
    <input type="password" id="pass" placeholder="Şifre" style="width:80%; margin-bottom:20px; padding:12px;">
    <button onclick="login()" style="width:80%; padding:15px; font-weight:bold;">GİRİŞ YAP</button>
</div>

<div id="sube-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:2000; padding:20px;">
    <div style="background:white; border-radius:8px; height:85vh; display:flex; flex-direction:column;">
        <div style="padding:10px;"><input type="text" id="sube-ara" placeholder="Şube ara..." oninput="filterSubeler()" style="width:100%; padding:12px;"></div>
        <div id="modal-list-body" style="flex:1; overflow-y:auto;"></div>
        <button onclick="closeModal()" style="padding:15px; background:#444; color:white;">KAPAT</button>
    </div>
</div>

<div id="camera-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:4000; flex-direction:column; justify-content:center;">
    <div id="reader"></div>
    <button onclick="stopScannerEx()" style="padding:15px; background:white; color:red; font-weight:bold;">İPTAL</button>
</div>

<div class="excel-bar">
    <div style="font-weight:bold; font-size: 14px;">FINART</div>
    <div class="user-area" style="display:flex; gap:5px;">
        <div class="user-cell" id="userTag">...</div>
        <button onclick="logout()" style="background:var(--red); color:white; border:none; border-radius:4px;">🚪</button>
    </div>
</div>

<div class="content">
    <div id="p-islem" class="app-page">
        <div style="background:#fff; padding:10px; border:1px solid #ccc; border-radius:4px; margin-bottom:5px;">
            <input type="text" id="target-sube" placeholder="Hedef Şube Seçin" readonly onclick="openModal()" style="width:100%; padding:12px; background:#fffde7; font-weight:bold;">
            <label id="truck-label" style="display:none; align-items:center; gap:10px; margin-top:10px; font-weight:bold; color:var(--excell-green);">
                <input type="checkbox" id="to-my-truck" onchange="toggleTruckMode()"> 🚛 ARACIMA TRANSFER ET
            </label>
        </div>
        <div id="items-container"></div>
        <div style="display:flex; gap:5px; margin-top:10px;">
            <button onclick="addRowEx()" style="flex:1; padding:12px;">➕ Satır Ekle</button>
            <button onclick="saveAllEx()" style="flex:1; padding:12px; background:var(--excell-green); color:white; border:none; font-weight:bold;">💾 KAYDET</button>
        </div>
    </div>

    <div id="p-akis" class="app-page" style="display:none;">
        <table class="excel-table" id="mainExTable">
            <thead><tr><th style="width:25%;">Lokasyon</th><th style="width:30%;">Ürün/Barkod</th><th style="width:20%;">Asistan</th><th style="width:25%;">İşlem</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
    
    <div id="p-depo" class="app-page" style="display:none;"><div id="depoExList"></div></div>
</div>

<div class="excel-nav">
    <div id="nav-islem" class="excel-nav-item active" onclick="tabEx('islem', this)">📝 Form</div>
    <div class="excel-nav-item" onclick="tabEx('akis', this)">📊 Akış</div>
    <div class="excel-nav-item" onclick="tabEx('depo', this)">📦 Depolar</div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAJcpDXuUiW2b-YHKNsIELtRi0AR96WPeY", authDomain: "depotakippro.firebaseapp.com", projectId: "depotakippro", databaseURL: "https://depotakippro-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let uName = ""; let uFullKey = ""; let isAracli = false; let html5Qr = null;
    const aracMap = { "adaksu@ziraatbank.com.tr": { ad: "AHMET", kod: "s542 Ahmet" }, "dokocadag@ziraatbank.com.tr": { ad: "DOĞAÇ", kod: "s573 Doğaç" }, "taylansahin@ziraatbank.com.tr": { ad: "TAYLAN", kod: "s574 Taylan" }, "adincel@ziraatbank.com.tr": { ad: "ALİ RIZA", kod: "s569 Ali Rıza" }, "ahaksu@ziraatbank.com.tr": { ad: "HALUK", kod: "s528 Haluk" } };
    const staticSubeler = ["S016 İZMİR SAHA DEPO", "68 BERGAMA/İZMİR ŞUBESİ", "145 KEMALPAŞA/İZMİR ŞUBESİ", "1815 İZMİR BÖLGE", "2697 ATATÜRK HASTANESİ"]; // Liste kısaltıldı, seninkini ekleyebilirsin

    function login() {
        const e = document.getElementById('email').value.trim().toLowerCase();
        const p = document.getElementById('pass').value;
        firebase.auth().signInWithEmailAndPassword(e, p).then(u => {
            if(aracMap[e]) {
                uName = aracMap[e].ad; uFullKey = aracMap[e].kod; isAracli = true;
                document.getElementById('truck-label').style.display = 'flex';
                tabEx('islem', document.getElementById('nav-islem'));
            } else {
                uName = e.split('@')[0].toUpperCase(); isAracli = false;
                document.getElementById('nav-islem').style.display = 'none';
                tabEx('akis', document.querySelectorAll('.excel-nav-item')[1]);
            }
            document.getElementById('userTag').innerText = uName;
            document.getElementById('login-screen').style.display = 'none';
            init();
        }).catch(() => alert("Hata!"));
    }

    function addRowEx(type = "GİRİŞ") {
        const rid = 'brk-' + Math.random().toString(36).substr(2, 5);
        const div = document.createElement('div'); div.className = "excel-row-container";
        // Sadece AL (GİRİŞ) ise büyüteç çıkar
        div.innerHTML = `<select class="type-select ${type==='ÇIKIŞ'?'bg-out':'bg-in'}" onchange="updateRowStyle(this)">
            <option value="GİRİŞ" ${type==='GİRİŞ'?'selected':''}>AL</option><option value="ÇIKIŞ" ${type==='ÇIKIŞ'?'selected':''}>VER</option></select>
            <div style="position:relative; flex:2; display:flex; align-items:center;">
                <input type="number" id="${rid}" placeholder="Barkod..." class="barkod-input">
                <span class="magnifier-btn mag-icon" style="display:${type==='GİRİŞ'?'block':'none'}" onclick="startScannerEx('${rid}')">🔍</span>
            </div>
            <select class="urun-select" onchange="checkNewUrun(this)"></select>`;
        document.getElementById('items-container').appendChild(div);
        updateAllSelects();
    }

    function updateRowStyle(sel) {
        sel.className = 'type-select ' + (sel.value === 'ÇIKIŞ' ? 'bg-out' : 'bg-in');
        sel.parentElement.querySelector('.mag-icon').style.display = (sel.value === 'GİRİŞ' ? 'block' : 'none');
    }

    function init() {
        if(isAracli) { document.getElementById('items-container').innerHTML = ""; addRowEx("GİRİŞ"); addRowEx("ÇIKIŞ"); }
        db.ref('transferler/canli_akis').on('value', snap => {
            const b = document.querySelector('#mainExTable tbody'); b.innerHTML = "";
            snap.forEach(i => {
                const d = i.val(); const key = i.key;
                const isReceiver = d.yer === uFullKey;
                const isD = d.status === "YAPILDI";
                let action = "";

                if(d.status === "ONAY BEKLIYOR" && isReceiver && isAracli) {
                    action = `<button class="btn-status bg-onay" onclick="db.ref('transferler/canli_akis/${key}').update({status:'BEKLEMEDE'})">KABUL ET</button>`;
                } else {
                    action = `<button class="btn-status ${isD?'bg-done':'bg-waiting'}" ${isAracli?'':'disabled'} onclick="toggleSt('${key}','${d.status}')">${isD?'OK':'BEKLE'}</button>`;
                }

                b.innerHTML = `<tr class="${isD?'row-done':(d.status==='ONAY BEKLIYOR'?'row-onay':'row-waiting')}">
                    <td>${d.yer}</td><td>${d.urun}<br><small>${d.barkod}</small><br>
                    <div class="kp-wrapper"><input type="text" value="${d.kp||''}" onblur="updateKp('${key}',this.value)" class="kp-input-large" ${isAracli?'':'disabled'}><span class="magnifier-btn" onclick="${isAracli?`startScannerEx('kp-${key}')`:''}">🔍</span></div></td>
                    <td>${d.gonderen}</td><td>${action}</td></tr>` + b.innerHTML;
            });
        });
        // Depolar ve Ürün Listesi Takibi Buraya Gelecek...
    }

    async function saveAllEx() {
        const target = document.getElementById('target-sube').value;
        if(!target) return alert("Hedef?");
        document.querySelectorAll('.excel-row-container').forEach(row => {
            const b = row.querySelector('.barkod-input').value;
            const u = row.querySelector('.urun-select').value;
            const t = row.querySelector('.type-select').value;
            if(b && !u.includes("ADD_NEW")) {
                let st = (aracMap[Object.keys(aracMap).find(k => aracMap[k].kod === target)]) ? "ONAY BEKLIYOR" : "BEKLEMEDE";
                let kpKod = (t === "ÇIKIŞ") ? target.split(' ')[0] : ""; // VER ise sadece kodu al
                db.ref('transferler/canli_akis').push({ gonderen: uName, yer: target, tip: t, barkod: b, urun: u, status: st, gonderen_kod: uFullKey, kp: kpKod });
            }
        });
        alert("Kayıt Başarılı"); location.reload();
    }

    function checkNewUrun(sel) { if(sel.value.includes("ADD_NEW")) { const n = prompt("Yeni Ürün?"); if(n) { db.ref('ayarlar/urun_listesi').push(n); sel.value = n; } else { sel.selectedIndex = 0; } } }
    function startScannerEx(tid) { document.getElementById('camera-modal').style.display='flex'; html5Qr = new Html5Qrcode("reader"); html5Qr.start({facingMode:"environment"}, {fps:10, qrbox:250}, (txt)=>{ document.getElementById(tid).value=txt; stopScannerEx(); }); }
    function stopScannerEx() { if(html5Qr) html5Qr.stop().then(()=>document.getElementById('camera-modal').style.display='none'); }
    function tabEx(id, el) { document.querySelectorAll('.app-page').forEach(p=>p.style.display='none'); document.getElementById('p-'+id).style.display='block'; document.querySelectorAll('.excel-nav-item').forEach(n=>n.classList.remove('active')); el.classList.add('active'); }
    function updateAllSelects() { db.ref('ayarlar/urun_listesi').once('value', snap => { let list = ["Pc","Monitör","Laptop"]; snap.forEach(i=>list.push(i.val())); document.querySelectorAll('.urun-select').forEach(s=>{ const v=s.value; s.innerHTML=list.map(u=>`<option value="${u}">${u}</option>`).join('')+`<option value="ADD_NEW (➕ EKLE)">ADD_NEW (➕ EKLE)</option>`; if(v) s.value=v; }); }); }
    function filterSubeler() { const a=document.getElementById('sube-ara').value.toUpperCase(); const b=document.getElementById('modal-list-body'); b.innerHTML=""; staticSubeler.filter(s=>s.toUpperCase().includes(a)).forEach(s=>{ const d=document.createElement('div'); d.style.padding="15px"; d.innerText=s; d.onclick=()=>{document.getElementById('target-sube').value=s; closeModal();}; b.appendChild(d); }); }
    function openModal() { document.getElementById('sube-modal').style.display='block'; filterSubeler(); }
    function closeModal() { document.getElementById('sube-modal').style.display='none'; }
    function toggleSt(k,s) { db.ref('transferler/canli_akis/'+k).update({status: s==='BEKLEMEDE'?'YAPILDI':'BEKLEMEDE'}); }
    function updateKp(k,v) { db.ref('transferler/canli_akis/'+k).update({kp:v}); }
    function logout() { firebase.auth().signOut().then(()=>location.reload()); }
    window.onload = () => document.getElementById('login-screen').style.display='flex';
</script>
</body>
</html>
