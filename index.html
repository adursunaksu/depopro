    firebase.auth().onAuthStateChanged(user => {
        if (user) setupUserSession(user.email);
        else document.getElementById('login-screen').style.display = 'flex';
    });

    function setupUserSession(email) {
        uMail = email.toLowerCase();
        const info = aracMap[uMail] || { ad: uMail.split('@')[0].toUpperCase(), kod: uMail.split('@')[0] };
        uName = info.ad; uFullKey = info.kod;
        document.getElementById('userTag').innerText = uName;
        document.getElementById('login-screen').style.display = 'none';
        if (!isInitialized) {
            document.getElementById('items-container').innerHTML = "";
            addRowEx("GİRİŞ"); addRowEx("ÇIKIŞ");
            init(); isInitialized = true;
        }
    }

    function init() {
        db.ref('ayarlar/urun_listesi').on('value', () => updateAllSelects());
        db.ref('ayarlar/sube_listesi').on('value', snap => {
            let list = []; snap.forEach(i => list.push(i.val()));
            dynamicSubeler = list; updateSubeCounter();
        });

        db.ref('transferler/canli_akis').on('value', snap => {
            const container = document.getElementById('groupedAkisContent');
            container.innerHTML = "";
            const rawData = [];
            snap.forEach(i => { let d = i.val(); d.key = i.key; rawData.push(d); });

            const groups = {};
            rawData.forEach(item => {
                const bId = item.batchId || (item.saat + item.yer + item.gonderen);
                if(!groups[bId]) groups[bId] = [];
                groups[bId].push(item);
            });

            Object.keys(groups).reverse().forEach(gKey => {
                const items = groups[gKey];
                const first = items[0];
                let tableHtml = `<table class="excel-table"><thead><tr class="group-header"><td colspan="2">📍 ${first.yer}</td><td colspan="2" style="text-align:right;">🕒 ${first.saat}</td></tr><tr><th>Ürün-Barkod</th><th>Asistan</th><th>KP NO</th><th>FINART</th></tr></thead><tbody>`;
                items.forEach(d => {
                    const isD = d.status === "YAPILDI";
                    const isOnay = d.status === "ONAY BEKLIYOR";
                    const rowClass = isD ? "row-done" : (isOnay ? "row-onay" : "row-waiting");
                    
                    let actionHtml = `<button class="btn-status ${isD?'bg-done':'bg-waiting'}" onclick="updateStatus('${d.key}','${d.status}')">${isD?'TAMAMLANDI':'BEKLİYOR'}</button>`;
                    if(isOnay) actionHtml = d.yer === uFullKey ? `<button class="btn-status bg-onay" onclick="approveTransfer('${d.key}')">KABUL ET</button>` : `<span style="color:orange;">ONAYDA</span>`;
                    
                    tableHtml += `<tr class="${rowClass}"><td><b>${d.urun}</b><br>${d.barkod}</td><td>${d.gonderen}</td><td>${d.kp||''}</td><td>${actionHtml}</td></tr>`;
                });
                tableHtml += `</tbody></table>`;
                container.innerHTML += tableHtml;
            });
        });

        db.ref('depolar').on('value', snap => {
            const c = document.getElementById('depoExList'); c.innerHTML = "";
            snap.forEach(d => {
                const isMyDepo = d.key === uFullKey;
                let rws = ""; 
                d.forEach(r => { let v = r.val(); rws += `<tr><td>${v.urun}</td><td>${v.barkod}</td></tr>`; });
                c.innerHTML += `<div style="margin-bottom:10px;"><div style="background:#217346; color:white; padding:8px; font-weight:bold;">📦 ${d.key}</div><table class="excel-table">${rws}</table></div>`;
            });
        });
    }

    function updateStatus(key, current) {
        db.ref('transferler/canli_akis/' + key).update({status: current === 'BEKLEMEDE' ? 'YAPILDI' : 'BEKLEMEDE'});
    }

    function addRowEx(type = "GİRİŞ") {
        const rowId = 'brk-' + Math.random().toString(36).substr(2, 5);
        const div = document.createElement('div'); div.className = "excel-row-container";
        div.innerHTML = `<select class="type-select ${type==='ÇIKIŞ'?'bg-out':'bg-in'}"><option value="GİRİŞ" ${type==='GİRİŞ'?'selected':''}>AL</option><option value="ÇIKIŞ" ${type==='ÇIKIŞ'?'selected':''}>VER</option></select><div class="scan-container"><input type="number" id="${rowId}" placeholder="Barkod..." class="barkod-input"><span class="magnifier-btn" onclick="startScannerEx('${rowId}')">🔍</span></div><select class="urun-select"></select>`;
        document.getElementById('items-container').appendChild(div);
        updateAllSelects();
    }

    function login() {
        firebase.auth().signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('pass').value).catch(err => alert(err.message));

    function logout() { if(confirm("Çıkış?")) firebase.auth().signOut().then(() => location.reload()); }
    function tabEx(id, el) { document.querySelectorAll('.app-page').forEach(p => p.style.display = 'none'); document.getElementById('p-'+id).style.display = 'block'; document.querySelectorAll('.excel-nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
    function openModal() { document.getElementById('sube-modal').style.display = 'block'; filterSubeler(); }
    function closeModal() { document.getElementById('sube-modal').style.display = 'none'; }
    function manualAdd() { const n = prompt("Yeni Lokasyon?"); if(n) db.ref('ayarlar/sube_listesi').push(n); }
    function filterSubeler() {
        const ara = document.getElementById('sube-ara').value.toUpperCase();
        const list = document.getElementById('modal-list-body'); list.innerHTML = "";
        const all = [...staticSubeler, ...dynamicSubeler];
        all.filter(s => s.toUpperCase().includes(ara)).forEach(s => {
            const d = document.createElement('div'); d.className = "sube-item"; d.innerText = s; d.onclick = () => { document.getElementById('target-sube').value = s; closeModal(); };
            list.appendChild(d);
        });
    }
    function updateSubeCounter() { document.getElementById('target-sube').placeholder = `Hedef Şube Seçin (${staticSubeler.length + dynamicSubeler.length})`; }
    function updateAllSelects() {
        db.ref('ayarlar/urun_listesi').once('value', snap => {
            let list = ["Cüzdan yazıcı","Pc","Tarayıcı","Monitör","Ip telefon","Switch","Router","Sunucu","Nvr","Laptop","Lazer yazıcı","Kamera"];
            snap.forEach(i => { if(!list.includes(i.val())) list.push(i.val()); });
            document.querySelectorAll('.urun-select').forEach(sel => {
                let h = ""; list.forEach(u => h += `<option value="${u}">${u}</option>`);
                sel.innerHTML = h;
            });
        });
    }

    async function saveAllEx() {
        const target = document.getElementById('target-sube').value;
        const toMyTruck = document.getElementById('to-my-truck').checked;
        if(!target && !toMyTruck) return alert("Şube seç!");
        const batchId = Date.now();
        document.querySelectorAll('.excel-row-container').forEach(row => {
            const b = row.querySelector('.barkod-input').value;
            const u = row.querySelector('.urun-select').value;
            const t = row.querySelector('.type-select').value;
            if(b) {
                if(toMyTruck) { db.ref('depolar/' + uFullKey).push({ urun: u, barkod: b }); }
                else { db.ref('transferler/canli_akis').push({ gonderen: uName, yer: target, tip: t, barkod: b, urun: u, status: "BEKLEMEDE", saat: new Date().toLocaleTimeString('tr-TR'), batchId: batchId }); }
            }
        });
        alert("Kaydedildi");
        document.getElementById('items-container').innerHTML = ""; addRowEx("GİRİŞ"); addRowEx("ÇIKIŞ");
    }

    function startScannerEx(id) {
        document.getElementById('camera-modal').style.display = 'flex';
        html5QrcodeScannerEx = new Html5Qrcode("reader");
        html5QrcodeScannerEx.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 150 } }, (text) => {
            document.getElementById(id).value = text;
            stopScannerEx();
        });
    }
    function toggleFlash() { if(html5QrcodeScannerEx) { flashOn = !flashOn; html5QrcodeScannerEx.applyVideoConstraints({ advanced: [{ torch: flashOn }] }); } }
    function stopScannerEx() { if(html5QrcodeScannerEx) html5QrcodeScannerEx.stop().then(() => { document.getElementById('camera-modal').style.display = 'none'; }); }
    function toggleTruckMode() { const isT = document.getElementById('to-my-truck').checked; document.getElementById('target-sube').value = isT ? uFullKey : ""; }
</script>
